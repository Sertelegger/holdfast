[package]
name = "holdfast-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
homepage.workspace = true
# **`readme` names a path above the package root and that is deliberate.**
# `cargo package` copies the file in and rewrites the field to `README.md`
# (verified: the generated manifest in the tarball reads `readme =
# "README.md"`), so the one README ships with both crates and there is no
# per-crate stub to keep in sync with it.
readme = "../../README.md"
categories = ["development-tools", "os::unix-apis"]
description = """\
The library behind the holdfast binary: PTY-backed session management, \
prompt detection, secret redaction, and the MCP tool and daemon wire \
protocols. The API tracks that binary's needs and is not yet stable.\
"""
# **One file, because exactly one file cannot work from a tarball.**
# `tests/source_guards.rs` asserts properties of `crates/holdfast/src` -- the
# *sibling* package -- through `CARGO_MANIFEST_DIR/../holdfast/src`, a path
# that does not exist in a single-crate tarball. Everything else under
# `tests/` builds and runs from one.
#
# **This started as `["/tests/*.rs", "/tests/wire-shape"]` and that was
# wrong**, which is the whole reason the rule is now one named file. Three
# `#[cfg(test)]` blocks in `src/` read files under `tests/` as data, and a
# pattern that drops test *sources* silently takes two of them with it:
#
#   src/config.rs:1797 ............. include_str! tests/fixtures/example_config.toml
#   src/secret/provider.rs:1658 .... reads tests/secrets.rs
#   src/secret/binding.rs:3667 ..... reads tests/secrets.rs
#
# Only the first is an `include_str!` and so only the first fails at compile
# time; the other two are `env!("CARGO_MANIFEST_DIR")` joins that panic at
# *run* time. Measured on the tarball built with the pattern above:
#
#   panicked at src/secret/provider.rs:1689:33: read
#     .../holdfast-core-0.0.7/tests/secrets.rs: No such file or directory
#   test result: FAILED. 0 passed; 2 failed
#
# **Nothing in the publish path reports either one.** `cargo package`'s
# verification build compiles the lib without `--cfg test`, so a broken
# exclude packages, verifies and publishes green; the breakage belongs
# entirely to whoever vendors the crate and runs its tests. A deny-list
# keyed on a glob has to re-derive that set every time a test moves. A
# deny-list of one named file does not.
exclude = ["/tests/source_guards.rs"]

