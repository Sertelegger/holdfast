# ----------------------------------------------------------------- generic

[[rule]]
name = "private-key-block"
kind = "private-key"
pattern = '''-----BEGIN[ A-Z]{0,20}PRIVATE KEY[ A-Z]{0,10}-----[\s\S]*?-----END[ A-Z]{0,20}PRIVATE KEY[ A-Z]{0,10}-----'''
prefixes = ["-----BEGIN"]
binary = true
positive = [
  "-----BEGIN RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQ==\n-----END RSA PRIVATE KEY-----",
]
negative = ["-----BEGIN CERTIFICATE-----"]

[[rule]]
name = "jwt"
kind = "jwt"
pattern = '''\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''
positive = [
  "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.dBjftJeZ4CVPmB92K27uhbUJU1p1r",
]
negative = ["eyJhbGciOiJIUzI1NiJ9.short"]

[[rule]]
name = "bearer-authorization"
kind = "bearer"
pattern = '''(?i)bearer\s+(?P<value>[A-Za-z0-9._~+/-]{20,}=*)'''
positive = ["Authorization: Bearer abcdefghijklmnopqrstuvwxyz"]
negative = ["Bearer short"]

# Two-word `*_KEY` labels. Found by walking the providers that have no
# dedicated rule and checking each one's canonical environment-variable
# name against `generic-secret-assignment` below: every one of them is
# reached through `password|secret|api_key|access_token|auth_token|token`
# EXCEPT the `<something>_KEY` shape, because that rule's `secret\b` needs
# a word boundary and `SECRET_KEY` continues with `_`. So `SECRET_KEY=`
# (Django's canonical name), `CLERK_SECRET_KEY=`, `PRIVATE_KEY=`,
# `ENCRYPTION_KEY=` and `FCM_SERVER_KEY=` were reached by nothing at all.
#
# This is a label-keyed rule, not a shape-keyed one: it is correct by
# construction because it keys on the variable name rather than on a token
# format nobody can cite. `PUBLIC_KEY=` and `SECRET_KEY_FILE=` are the
# negatives that keep it from swallowing non-secrets.
[[rule]]
name = "secret-key-assignment"
kind = "generic"
pattern = '''(?i)\b[a-z0-9_.-]{0,32}(?:secret|private|encryption|signing|master|session)[_-]key\b["'\s]*[:=]\s*["']?(?P<value>[^\s"';,)]{8,})'''
prefixes = [
  "secret_key",
  "secret-key",
  "private_key",
  "private-key",
  "encryption_key",
  "encryption-key",
  "signing_key",
  "signing-key",
  "master_key",
  "master-key",
  "session_key",
  "session-key",
]
positive = [
  "CLERK_SECRET_KEY=sk_test_0123456789abcdef01234567",
  "SECRET_KEY = 'django-insecure-0123456789abcdef'",
  "app.encryption_key: 0123456789abcdef",
]
negative = ["SECRET_KEY_FILE=/run/secrets/app", "PUBLIC_KEY=0123456789abcdef", "SECRET_KEY="]

# The catch-all. `token` is in the alternation deliberately: without it an
# assignment to a bare `*_TOKEN` variable -- the shape Linode, Vercel,
# Postmark, Doppler and most one-off CI credentials take -- is covered by
# nothing at all, because their values carry no recognisable prefix.
[[rule]]
name = "generic-secret-assignment"
kind = "generic"
pattern = '''(?i)\b[a-z0-9_.-]{0,32}(?:password|passwd|secret|api[_-]?key|access[_-]?token|auth[_-]?token|token)\b["'\s]*[:=]\s*["']?(?P<value>[^\s"';,)]{8,})'''
prefixes = [
  "password",
  "passwd",
  "secret",
  "apikey",
  "api_key",
  "api-key",
  "accesstoken",
  "access_token",
  "access-token",
  "authtoken",
  "auth_token",
  "auth-token",
]
positive = [
  "export DB_PASSWORD=hunter2hunter2",
  "api_key: 's3cr3t-value'",
  "LINODE_TOKEN=0123456789abcdef0123456789abcdef",
]
negative = ["password: short", "PASSWORD_FILE_PATH", "token = 1234"]

# --------------------------------------------------------- the group-3 walk
#
# Providers with no dedicated rule above, walked one by one and left to the
# two generic rules deliberately: Bitbucket, Azure, Linode, Vercel, Netlify,
# Heroku, Turso, Twilio, Square, PayPal, Auth0, Clerk, Firebase, WorkOS,
# Postmark, Doppler, Mistral, Cohere, Together, DeepSeek, Azure OpenAI,
# ElevenLabs, Deepgram, AssemblyAI, Weights & Biases, Cerebras, LangSmith,
# Voyage, Modal, AI21.
#
# None of them was given a shape-keyed rule, because none of their token
# formats can be cited from a primary source here, and a rule whose only
# evidence is the example written beside it proves the regex is
# self-consistent rather than that it matches a real credential.
#
# The walk was mechanical: each provider's canonical environment-variable
# name was run against `generic-secret-assignment`. All of them are reached
# except the `*_KEY` shape, which is why `secret-key-assignment` exists.
# One residual is left knowingly: `MODAL_TOKEN_ID` is reached by nothing,
# because `token` there is followed by `_ID` and the rule needs a word
# boundary. That value is an identifier, not the credential -- Modal's
# secret half is `MODAL_TOKEN_SECRET`, which is covered.
#
# Everything these two rules catch is reported as `[REDACTED:generic]`, not
# by provider name. A value pasted with no label at all is not redacted.
