# CLASP built-in secret-redaction rules (spec §9.2).
#
# Derived from the gitleaks default rule set (MIT) plus CLASP additions
# for AI provider keys. Refreshed quarterly; `source_version` records the
# upstream snapshot this file was derived from.
#
# Field reference:
#   name      unique rule id; a user rule with the same name overrides it
#   kind      what the agent sees: `[REDACTED:<kind>]`
#   pattern   `regex::bytes` syntax. If it has a capture group named
#             `value`, only that group is redacted and the rest of the
#             match (the context prefix) is left intact.
#   prefixes  optional literal prefixes for the partial-secret index
#             (§4.1). Omit to auto-derive from `pattern`.
#   binary    optional; true when the value may contain whitespace or
#             control bytes (PEM blocks). Defaults to false.
#   positive  MUST match. At least one required.
#   negative  MUST NOT match. At least one required.
#
# ORDER MATTERS. More specific rules come first: when two rules cover the
# same bytes the earlier one names the kind (see `merge_spans`).

source_version = "gitleaks-8.28.0"

# ------------------------------------------------------------ AI providers

[[rule]]
name = "anthropic-api-key"
kind = "anthropic"
pattern = '''\bsk-ant-[A-Za-z0-9_-]{24,}'''
positive = ["sk-ant-api03-AAAABBBBCCCCDDDDEEEEFFFFGGGG"]
negative = ["sk-ant-short"]

[[rule]]
name = "openrouter-api-key"
kind = "openrouter"
pattern = '''\bsk-or-v1-[a-f0-9]{64}'''
positive = [
  "sk-or-v1-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef",
]
negative = ["sk-or-v1-0123"]

[[rule]]
name = "openai-api-key"
kind = "openai"
pattern = '''\bsk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_-]{24,}'''
prefixes = ["sk-", "sk-proj-", "sk-svcacct-", "sk-admin-"]
positive = [
  "sk-AAAABBBBCCCCDDDDEEEEFFFFGGGG",
  "sk-proj-AAAABBBBCCCCDDDDEEEEFFFFGGGG",
]
negative = ["sk-tiny"]

[[rule]]
name = "openai-session-key"
