# ------------------------------------------------------------------- cloud

[[rule]]
name = "aws-access-key-id"
kind = "aws"
pattern = '''\b(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}'''
prefixes = ["AKIA", "ASIA", "ABIA", "ACCA"]
positive = ["AKIAIOSFODNN7EXAMPLE"]
negative = ["AKIAIOSF"]

[[rule]]
name = "aws-secret-access-key"
kind = "aws"
pattern = '''(?i)aws_secret_access_key["'\s]*[:=]\s*["']?(?P<value>[A-Za-z0-9/+=]{40})'''
positive = ["AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMIK7MDENGbPxRfiCYEXAMPLEKEY01"]
negative = ["AWS_SECRET_ACCESS_KEY=short"]

[[rule]]
name = "digitalocean-token"
kind = "digitalocean"
pattern = '''\bdop_v1_[a-f0-9]{64}'''
positive = [
  "dop_v1_0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef",
]
negative = ["dop_v1_0123"]

[[rule]]
name = "cloudflare-origin-ca-key"
kind = "cloudflare"
pattern = '''\bv1\.0-[A-Za-z0-9-]{40,}'''
positive = ["v1.0-0123456789abcdef0123456789abcdef01234567"]
negative = ["v1.0-0123"]

# Cloudflare API tokens are 40 unprefixed `[A-Za-z0-9_-]` characters, so
# they can only be recognised from their label. `CLOUDFLARE_API_TOKEN`
# contains neither `api_key` nor `auth_token`, so the generic assignment
# rule does not reach it -- this rule is what covers it.
[[rule]]
name = "cloudflare-api-token"
kind = "cloudflare"
pattern = '''(?i)\bcloudflare[a-z0-9_.-]{0,24}(?:token|key|secret)\b["'\s]*[:=]\s*["']?(?P<value>[A-Za-z0-9_.-]{20,})'''
positive = [
  "CLOUDFLARE_API_TOKEN=0123456789abcdefghij0123456789abcdefghij",
  "cloudflare_global_api_key: 'abcdef0123456789abcdef0123456789abcd'",
]
negative = [
  "CLOUDFLARE_ACCOUNT_ID=0123",
  "https://api.cloudflare.com/client/v4/zones",
]

[[rule]]
name = "flyio-token"
kind = "flyio"
pattern = '''\bfo1_[A-Za-z0-9_-]{40,}'''
positive = ["fo1_0123456789abcdef0123456789abcdef01234567"]
negative = ["fo1_0123"]

[[rule]]
name = "render-api-key"
kind = "render"
pattern = '''\brnd_[A-Za-z0-9]{28,}'''
positive = ["rnd_0123456789abcdef0123456789ab"]
negative = ["rnd_0123"]

# Railway project and account tokens are bare UUIDs, so like Cloudflare
# they are only recognisable from their label. `RAILWAY_TOKEN` matches no
# alternative in `generic-secret-assignment`.
[[rule]]
name = "railway-token"
kind = "railway"
pattern = '''(?i)\brailway[a-z0-9_.-]{0,24}(?:token|key|secret)\b["'\s]*[:=]\s*["']?(?P<value>[A-Za-z0-9_.-]{16,})'''
positive = [
  "RAILWAY_TOKEN=0123abcd-4567-89ef-0123-456789abcdef",
  "railway_api_token: 'abcdef0123456789abcdef'",
]
negative = ["RAILWAY_ENVIRONMENT=production", "RAILWAY_TOKEN="]

# --------------------------------------------------------- databases / sync

[[rule]]
name = "supabase-service-key"
kind = "supabase"
pattern = '''\bsbp_[a-f0-9]{40,}'''
positive = ["sbp_0123456789abcdef0123456789abcdef01234567"]
negative = ["sbp_0123"]

[[rule]]
name = "planetscale-token"
kind = "planetscale"
pattern = '''\bpscale_(?:pw|tkn)_[A-Za-z0-9_.-]{32,}'''
prefixes = ["pscale_pw_", "pscale_tkn_"]
positive = ["pscale_pw_0123456789abcdef0123456789abcdef"]
negative = ["pscale_pw_0123"]

# PowerSync publishes no fixed-prefix token format: development and client
# tokens are JWTs (caught separately by the `jwt` rule) and the CLI's
# personal access token is opaque. Both reach a terminal as an assignment
# to a `POWERSYNC_*` variable, and `POWERSYNC_TOKEN` matches no alternative
# in `generic-secret-assignment` -- so without this rule PowerSync
# credentials are covered by nothing at all.
[[rule]]
name = "powersync-token"
kind = "powersync"
pattern = '''(?i)\bpowersync[a-z0-9_.-]{0,24}(?:token|key|secret|password)\b["'\s]*[:=]\s*["']?(?P<value>[^\s"';,)]{8,})'''
positive = [
  "POWERSYNC_TOKEN=eyJhbGciOiJSUzI1NiJ9.PLACEHOLDERPLACEHOLDER",
  "export POWERSYNC_DEV_TOKEN='abcdef0123456789'",
  "powersync_private_key: 'abcdef0123456789abcdef'",
]
negative = [
  "POWERSYNC_URL=https://example.powersync.journeyapps.com",
  "POWERSYNC_TOKEN=",
]

[[rule]]
name = "database-connection-password"
kind = "connection-string"
pattern = '''\b(?:postgres|postgresql|mysql|mongodb\+srv|mongodb|redis|amqp)://[^:@/\s]+:(?P<value>[^@/\s]+)@'''
prefixes = [
  "postgres://",
  "postgresql://",
  "mysql://",
  "mongodb://",
  "mongodb+srv://",
  "redis://",
  "amqp://",
]
positive = ["postgresql://svc:hunter2GOESHERE@db.internal:5432/app"]
negative = ["postgresql://db.internal:5432/app"]

