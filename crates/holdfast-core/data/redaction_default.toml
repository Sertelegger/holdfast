# Holdfast built-in secret-redaction rules (spec §9.2).
#
# Derived from the gitleaks default rule set (MIT) plus Holdfast additions
# for AI provider keys. Refreshed quarterly; `source_version` records the
# upstream snapshot this file was derived from.
#
# Field reference:
#   name      unique rule id; a user rule with the same name overrides it
#   kind      what the agent sees: `[REDACTED:<kind>]`
#   pattern   `regex::bytes` syntax. If it has a capture group named
#             `value`, only that group is redacted and the rest of the
#             match (the context prefix) is left intact.
#   prefixes  optional literal prefixes for the partial-secret index
#             (§4.1). Omit to auto-derive from `pattern`.
#   binary    optional; true when the value may contain whitespace or
#             control bytes (PEM blocks). Defaults to false.
#   value_must_not_match
#             optional regex. When it matches the WHOLE of what the rule
#             would redact -- the `value` capture, or the whole match on a
#             rule without one -- the candidate is refused: the rule found
#             its shape and then judged that this instance is not a
#             credential. The loader anchors it `\A...\z` and compiles it
#             in byte mode, so write the bare expression. This is
#             gitleaks' own `allowlist.regexes` mechanism and its own
#             polarity -- see `generic-secret-assignment` below for why
#             the shipped expression is not gitleaks'.
#   positive  MUST match. At least one required.
#   negative  MUST NOT match. At least one required.
#
# ORDER MATTERS. More specific rules come first: when two rules cover the
# same bytes the earlier one names the kind (see `merge_spans`).

source_version = "gitleaks-8.28.0"

# ------------------------------------------------------------ AI providers

[[rule]]
name = "anthropic-api-key"
kind = "anthropic"
pattern = '''\bsk-ant-[A-Za-z0-9_-]{24,}'''
positive = ["sk-ant-api03-AAAABBBBCCCCDDDDEEEEFFFFGGGG"]
negative = ["sk-ant-short"]

[[rule]]
name = "openrouter-api-key"
kind = "openrouter"
pattern = '''\bsk-or-v1-[a-f0-9]{64}'''
positive = [
  "sk-or-v1-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef",
]
negative = ["sk-or-v1-0123"]

# GH #245: OpenSSH names its FIDO key types `sk-<alg>@openssh.com`, and
# `sk-ecdsa-sha2-nistp256-cert-v01` is long enough to satisfy the pattern
# -- so `ssh -G`, `ssh -vvv` and any `sshd_config` that lists algorithms
# read as an OpenAI key. This rule has no `value` group, so its refusal
# judges the whole match, and it declines exactly that family: lower-case
# letters, digits and hyphens after `sk-ecdsa-` or `sk-ssh-`. No issuer's
# shape reaches it -- a legacy key is alphanumeric with no hyphen at all,
# a project key opens `sk-proj-`, and a hex body cannot spell `ssh` or
# `ecdsa`.
[[rule]]
name = "openai-api-key"
kind = "openai"
pattern = '''\bsk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_-]{24,}'''
prefixes = ["sk-", "sk-proj-", "sk-svcacct-", "sk-admin-"]
value_must_not_match = '''sk-(?:ecdsa|ssh)-[a-z0-9-]*'''
positive = [
  "sk-AAAABBBBCCCCDDDDEEEEFFFFGGGG",
  "sk-proj-AAAABBBBCCCCDDDDEEEEFFFFGGGG",
  # A lower-case hex body -- the shape DeepSeek mints, which nothing but
  # this rule catches unlabelled -- is outside the refused family.
  "sk-0123456789abcdef0123456789abcdef",
]
negative = [
  "sk-tiny",
  "pubkeyacceptedalgorithms sk-ecdsa-sha2-nistp256-cert-v01@openssh.com,sk-ssh-ed25519@openssh.com",
]

[[rule]]
name = "openai-session-key"
kind = "openai"
pattern = '''\bsess-[A-Za-z0-9]{32,}'''
positive = ["sess-0123456789abcdef0123456789abcdef"]
negative = ["sess-0123"]

[[rule]]
name = "google-api-key"
kind = "google"
pattern = '''\bAIza[0-9A-Za-z_-]{35}'''
positive = ["AIzaSyA0123456789abcdefghijklmnopqrstuv"]
negative = ["AIzaSyA0123"]

[[rule]]
name = "gcp-oauth-token"
kind = "gcp"
pattern = '''\bya29\.[0-9A-Za-z_-]{20,}'''
positive = ["ya29.a0AfB_byABCDEFGHIJKLMNOPQRSTUVWX"]
negative = ["ya29.short"]

[[rule]]
name = "xai-api-key"
kind = "xai"
pattern = '''\bxai-[A-Za-z0-9]{32,}'''
positive = ["xai-0123456789abcdef0123456789abcdef"]
negative = ["xai-0123"]

[[rule]]
name = "huggingface-token"
kind = "huggingface"
pattern = '''\bhf_[A-Za-z0-9]{34,}'''
positive = ["hf_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefgh"]
negative = ["hf_ABCDEF"]

[[rule]]
name = "nvidia-api-key"
kind = "nvidia"
pattern = '''\bnvapi-[A-Za-z0-9_-]{40,}'''
positive = [
  "nvapi-0123456789abcdefghijABCDEFGHIJ0123456789abcdefghijABCDEFGHIJ",
]
negative = ["nvapi-0123456789"]

[[rule]]
name = "groq-api-key"
kind = "groq"
pattern = '''\bgsk_[A-Za-z0-9]{40,}'''
positive = ["gsk_0123456789abcdef0123456789abcdef01234567"]
negative = ["gsk_0123456789"]

[[rule]]
name = "perplexity-api-key"
kind = "perplexity"
pattern = '''\bpplx-[A-Za-z0-9]{32,}'''
positive = ["pplx-0123456789abcdef0123456789abcdef"]
negative = ["pplx-0123"]

[[rule]]
name = "replicate-api-token"
kind = "replicate"
pattern = '''\br8_[A-Za-z0-9]{35,}'''
positive = ["r8_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"]
negative = ["r8_ABCDEF"]

[[rule]]
name = "fireworks-api-key"
kind = "fireworks"
pattern = '''\bfw_[A-Za-z0-9]{24,}'''
positive = ["fw_0123456789abcdef01234567"]
negative = ["fw_0123"]

# ------------------------------------------- source control / package registries

[[rule]]
