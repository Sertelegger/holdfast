positive = [
  "ghp_0123456789abcdefghijABCDEFGHIJ012345",
  "gho_0123456789abcdefghijABCDEFGHIJ012345",
]
negative = ["ghp_abcdef", "ghz_0123456789abcdefghijABCDEFGHIJ012345"]

[[rule]]
