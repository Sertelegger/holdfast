# ------------------------------------------------------------------- cloud

[[rule]]
name = "aws-access-key-id"
kind = "aws"
pattern = '''\b(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}'''
prefixes = ["AKIA", "ASIA", "ABIA", "ACCA"]
positive = ["AKIAIOSFODNN7EXAMPLE"]
negative = ["AKIAIOSF"]

[[rule]]
name = "aws-secret-access-key"
kind = "aws"
pattern = '''(?i)aws_secret_access_key["' \t]*(?::[ \t]*|=[ \t]*(?:\r?\n[ \t]+)?)["']?(?P<value>[A-Za-z0-9/+=]{40})'''
positive = ["AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMIK7MDENGbPxRfiCYEXAMPLEKEY01"]
negative = ["AWS_SECRET_ACCESS_KEY=short"]

[[rule]]
name = "digitalocean-token"
kind = "digitalocean"
pattern = '''\bdop_v1_[a-f0-9]{64}'''
positive = [
  "dop_v1_0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef",
]
negative = ["dop_v1_0123"]

[[rule]]
name = "cloudflare-origin-ca-key"
kind = "cloudflare"
pattern = '''\bv1\.0-[A-Za-z0-9-]{40,}'''
positive = ["v1.0-0123456789abcdef0123456789abcdef01234567"]
negative = ["v1.0-0123"]

# Cloudflare API tokens are 40 unprefixed `[A-Za-z0-9_-]` characters, so
# they can only be recognised from their label. `CLOUDFLARE_API_TOKEN`
# contains neither `api_key` nor `auth_token`, so the generic assignment
# rule does not reach it -- this rule is what covers it.
[[rule]]
name = "cloudflare-api-token"
kind = "cloudflare"
pattern = '''(?i)\bcloudflare[a-z0-9_.-]{0,24}(?:token|key|secret)\b["' \t]*(?::[ \t]*|=[ \t]*(?:\r?\n[ \t]+)?)["']?(?P<value>[A-Za-z0-9_.-]{20,})'''
positive = [
  "CLOUDFLARE_API_TOKEN=0123456789abcdefghij0123456789abcdefghij",
  "cloudflare_global_api_key: 'abcdef0123456789abcdef0123456789abcd'",
]
negative = [
  "CLOUDFLARE_ACCOUNT_ID=0123",
  "https://api.cloudflare.com/client/v4/zones",
]

[[rule]]
name = "flyio-token"
kind = "flyio"
pattern = '''\bfo1_[A-Za-z0-9_-]{40,}'''
positive = ["fo1_0123456789abcdef0123456789abcdef01234567"]
negative = ["fo1_0123"]

[[rule]]
name = "render-api-key"
kind = "render"
pattern = '''\brnd_[A-Za-z0-9]{28,}'''
positive = ["rnd_0123456789abcdef0123456789ab"]
negative = ["rnd_0123"]

# Railway project and account tokens are bare UUIDs, so like Cloudflare
# they are only recognisable from their label. `RAILWAY_TOKEN` matches no
# alternative in `generic-secret-assignment`.
[[rule]]
name = "railway-token"
kind = "railway"
pattern = '''(?i)\brailway[a-z0-9_.-]{0,24}(?:token|key|secret)\b["' \t]*(?::[ \t]*|=[ \t]*(?:\r?\n[ \t]+)?)["']?(?P<value>[A-Za-z0-9_.-]{16,})'''
positive = [
  "RAILWAY_TOKEN=0123abcd-4567-89ef-0123-456789abcdef",
  "railway_api_token: 'abcdef0123456789abcdef'",
]
negative = ["RAILWAY_ENVIRONMENT=production", "RAILWAY_TOKEN="]

# --------------------------------------------------------- databases / sync

[[rule]]
name = "supabase-service-key"
kind = "supabase"
pattern = '''\bsbp_[a-f0-9]{40,}'''
positive = ["sbp_0123456789abcdef0123456789abcdef01234567"]
negative = ["sbp_0123"]

[[rule]]
name = "planetscale-token"
kind = "planetscale"
pattern = '''\bpscale_(?:pw|tkn)_[A-Za-z0-9_.-]{32,}'''
prefixes = ["pscale_pw_", "pscale_tkn_"]
positive = ["pscale_pw_0123456789abcdef0123456789abcdef"]
negative = ["pscale_pw_0123"]

# PowerSync publishes no fixed-prefix token format: development and client
# tokens are JWTs (caught separately by the `jwt` rule) and the CLI's
# personal access token is opaque. Both reach a terminal as an assignment
# to a `POWERSYNC_*` variable, and `POWERSYNC_TOKEN` matches no alternative
# in `generic-secret-assignment` -- so without this rule PowerSync
# credentials are covered by nothing at all.
[[rule]]
name = "powersync-token"
kind = "powersync"
pattern = '''(?i)\bpowersync[a-z0-9_.-]{0,24}(?:token|key|secret|password)\b["' \t]*(?::[ \t]*|=[ \t]*(?:\r?\n[ \t]+)?)["']?(?P<value>[^\s"';,)]{8,})'''
positive = [
  "POWERSYNC_TOKEN=eyJhbGciOiJSUzI1NiJ9.PLACEHOLDERPLACEHOLDER",
  "export POWERSYNC_DEV_TOKEN='abcdef0123456789'",
  "powersync_private_key: 'abcdef0123456789abcdef'",
]
negative = [
  "POWERSYNC_URL=https://example.powersync.journeyapps.com",
  "POWERSYNC_TOKEN=",
]

# GH #244 widened this in four directions at once, each one a spelling
# that went out raw:
#
# * **More schemes**, and the TLS ones: `rediss://` (Upstash, Heroku),
#   `amqps://`, `mariadb://`, `mssql://`, and the rest of what a
#   `DATABASE_URL` holds in practice.
# * **A `+driver` suffix**, which is how SQLAlchemy spells every URL it
#   takes (`postgresql+psycopg2://`, `mysql+pymysql://`) and how MongoDB
#   spells `mongodb+srv://` -- so that is no longer its own alternative.
# * **An empty user.** `redis://:<password>@host` is Redis's own form
#   for a server with `requirepass` and no ACL user.
# * **A `/` or an `@` inside the password.** SQLAlchemy splits the
#   userinfo at the first `@` and keeps a raw `/` in the password;
#   redis-py and `urllib` split at the *last* `@`. The value class
#   therefore runs to the last `@` before whitespace, a quote or a
#   backtick: where the two readings disagree this redacts the longer
#   one, which over-covers a host rather than leaking a password.
#
# **A quote or a backtick inside the password is the second branch of
# the value, and it is there because the first one lost it.** Stopping
# at a quote keeps a quoted URL from running into whatever follows it in
# the same token (`"postgres://u:p@h","x@y"`), but `'` is a legal
# sub-delimiter in userinfo and generators emit it -- and `a81b02d`'s
# value, `[^@/\s]+`, redacted `postgres://app:Pa'ss9word@db` where the
# first branch alone does not (found by review of GH #244). The second
# branch *is* `a81b02d`'s class, taken only when the first finds no `@`,
# and the rule therefore matches everything either one did except a
# one-byte password that is a quote. It needs two bytes rather than one
# so that `amqp://:'@` does not tile ten bytes to a marker, which would
# be the widest growth in this file (`tests/redaction_growth.rs`). It
# stops at `/` as `a81b02d`'s did, so a URL with no userinfo, a quote in
# its query and an `@` further on is not read as a password.
#
# The value is still only the password: `postgresql://svc:` and
# `@db.internal` stay visible.
[[rule]]
name = "database-connection-password"
kind = "connection-string"
pattern = '''\b(?:postgres(?:ql)?|mysql|mariadb|mssql|sqlserver|oracle|cockroachdb|clickhouse|snowflake|mongodb|rediss?|valkeys?|amqps?|neo4j|bolt)(?:\+[A-Za-z0-9_]+)*://[^:@/\s]*:(?P<value>[^\s"'`]+|[^@/\s]{2,})@'''
prefixes = [
  "postgres://",
  "postgresql://",
  "postgresql+",
  "mysql://",
  "mysql+",
  "mariadb://",
  "mariadb+",
  "mssql://",
  "mssql+",
  "sqlserver://",
  "oracle://",
  "oracle+",
  "cockroachdb://",
  "cockroachdb+",
  "clickhouse://",
  "clickhouse+",
  "snowflake://",
  "mongodb://",
  "mongodb+",
  "redis://",
  "rediss://",
  "redis+",
  "valkey://",
  "valkeys://",
  "amqp://",
  "amqps://",
  "neo4j://",
  "neo4j+",
  "bolt://",
  "bolt+",
]
positive = [
  "postgresql://svc:hunter2GOESHERE@db.internal:5432/app",
  "REDIS_URL=rediss://default:hunter2GOESHERE@x.upstash.io:6379",
  "REDIS_URL=redis://:hunter2GOESHERE@cache:6379/0",
  "SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://app:hunter2GOESHERE@db/app",
  "mysql+pymysql://app:hunter2GOESHERE@db/app",
  "CELERY_BROKER_URL=amqps://app:hunter2GOESHERE@mq.internal/vhost",
  "mariadb://app:hunter2GOESHERE@db/app",
  "mssql://sa:hunter2GOESHERE@db/app",
  "mongodb+srv://app:hunter2GOESHERE@cluster0.example.net/?retryWrites=true",
  "postgresql+asyncpg://app:hunter2/GOES@db/app",
  "redis://:hunter2@GOESHERE@cache:6379/0",
  # A quote or a backtick inside the password: the second branch.
  "DATABASE_URL=postgres://app:hunter2'GOESHERE@db/app",
  "DATABASE_URL=postgres://app:hunter2\"GOESHERE@db/app",
  "mongodb://app:hunter2`GOESHERE@db/app",
]
negative = [
  "postgresql://db.internal:5432/app",
  "redis://localhost:6379/0",
  "mongodb+srv://cluster0.example.net/?retryWrites=true",
  "postgres://db.internal:5432/app?application_name='etl'&options=user@corp",
]

# **Credentials in the userinfo of any other URL** (GH #244):
# `https://admin:<password>@host`, a `git clone` over HTTPS with a token
# in it, `HTTPS_PROXY=http://user:<password>@proxy:3128`, an RTSP camera.
#
# **It redacts the whole `scheme://user:password@`, not only the
# password, and that is for the frame budget rather than for the
# reader.** A marker is sized by its kind, not by what it replaces, and
# with an empty user and a one-byte password this rule's shortest match
# is `ws://:x@` -- eight bytes, which tiles back to back with no
# separator because the next `ws` starts on a word boundary. Redacting
# only the value would leave seven of those eight bytes and add the
# marker to each tile, the widest growth anywhere in this file and past
# the worst case `Config::validate` sizes `MAX_FRAME_BYTES`' headroom
# from. Redacting the whole match replaces the eight bytes with one
# marker. `tests/redaction_growth.rs` measures both spellings.
#
# **The value class is RFC 3986's authority, not the database rule's.**
# It stops at `/`, `?` and `#`, so a port followed by an `@` in the path
# -- Vite's `http://localhost:5173/@vite/client`, npm's `/@scope/` -- is
# not read as a password. Inside the authority it runs to the last `@`,
# which is where `urllib` splits.
#
# **Its prefix-index entries are narrow on purpose, and the gap that
# leaves is stated rather than hidden.** An entry at `https://` would hold
# every URL a program prints at the buffer head until its authority ends
# -- `https://example.internal` can still become
# `https://example.internal:<password>@` -- and ordinary output must never
# be held back (`ordinary_build_output_never_yields_a_boundary`). So the
# entries are the usernames that exist to carry a token --
# `x-access-token` (GitHub), `oauth2` and `gitlab-ci-token` (GitLab),
# `x-token-auth` (Bitbucket) -- with the colon that ends them, which no
# ordinary URL contains. A password still arriving behind any other
# username is **not** held at the buffer head, and is redacted as soon as
# its `@` arrives; that is §4.1's partial-secret window, open for this
# rule and closed for the four spellings above.
#
# The scheme list is explicit rather than `[a-z][a-z0-9+.-]*` so that
# the rule's match begins at a literal; `sftp` is absent because its
# match begins one byte before `ftp://`, which would cost the whole rule
# its liveness automaton (`rule_may_start_one_byte_before`).
[[rule]]
name = "url-userinfo-password"
kind = "url-password"
pattern = '''\b(?:https?|ftps?|ssh|git(?:\+(?:ssh|https?))?|svn(?:\+ssh)?|wss?|smtps?|imaps?|pop3s?|ldaps?|mqtts?|nats|socks(?:4a?|5h?)|rtsps?|rtmps?)://[^:@/?#\s"'`]*:[^/?#\s"'`]+@'''
prefixes = [
  "https://x-access-token:",
  "https://oauth2:",
  "https://gitlab-ci-token:",
  "https://x-token-auth:",
]
positive = [
  "curl https://admin:hunter2GOESHERE@internal.example.com/api",
  "git clone https://x-access-token:hunter2GOESHERE@github.com/org/repo.git",
  "HTTPS_PROXY=http://proxyuser:hunter2GOESHERE@proxy.corp:3128",
  "ftp://anonymous:hunter2GOESHERE@ftp.example.org/pub",
  "rtsp://admin:hunter2GOESHERE@192.168.1.10:554/stream1",
  "pip install git+https://oauth2:hunter2GOESHERE@gitlab.example.com/org/pkg.git",
]
negative = [
  "https://example.com:8443/path",
  "http://localhost:5173/@vite/client",
  "ssh://git@github.com:22/org/repo.git",
  "https://user@example.com/login",
  "http://[::1]:8080/",
]

# ------------------------------------------------------ command-line flags
#
# A password passed as an argument is echoed by the terminal, lands in
# `status.command` and `get_command_history`, and is exactly the shape
# spec §9.2's table names (`mysql -u u -ppassword`). Neither of these
# has a label the assignment rules can key on: `mysql`'s `-p` takes its
# value *attached*, and a registry login's `-p`/`--password` takes it as
# the next argument, after a space. Both are keyed on the program, and
# the gap between the program and the flag stays on one line and stops
# at a pipe, a `;` or a `&`, so a later command's `-p` is not read as
# this one's.
#
# `mysql -p` with no value prompts for the password; it is not a match.
# `--password-stdin` is the recommended spelling and is not a match
# either. `--password=…` is also `generic-secret-assignment`'s.
#
# **The value is quote-aware, because a shell's quotes are what let a
# password carry the bytes the unquoted class stops at.** Unquoted, `&`,
# `|`, `;`, `<` and `>` end a shell word, so the value stops there. Inside
# `'…'` or `"…"` they are the password's own bytes, and a class that
# stopped at them anyway redacted `-p'Xk9#mP` and handed out `&2qLzQ'`
# (found by review of GH #244). A quoted value runs to its closing quote
# on the same line, spaces included, and the quotes go under the marker
# with it. An opening quote whose closing one has not arrived falls to
# the unquoted branch, so a quoted password still arriving is redacted as
# far as it has come rather than not at all.
[[rule]]
name = "mysql-cli-password"
kind = "cli-password"
pattern = '''\b(?:mysql|mariadb)[a-z-]*\b[^\r\n|;&]*?[ \t]-p(?P<value>'[^'\r\n]+'|"[^"\r\n]+"|["']?[^\s"'`;|&<>]+)'''
# The program name followed by its space, for the same reason
# `basic-authorization` indexes its whole header: a context rule's
# candidate is held while every byte after the prefix is printable, so
# `mysql -phunter2` still arriving is held and `mysqldump` at the buffer
# head is not. A `-p` further along the line is past a space and is
# GH #152's gap, as it is for every context rule whose value follows one.
prefixes = ["mysql ", "mariadb "]
positive = [
  "mysql -u root -phunter2GOESHERE app",
  "mysqldump -uroot -p'hunter2GOESHERE' app > dump.sql",
  "docker exec -it db mariadb-dump -u root -phunter2GOESHERE --all-databases",
  "mysql -u root -p'hunter2&GOESHERE' app",
  "mysql -u root -p\"hunter2|GOES;HERE\" app",
]
negative = [
  "mysql -u root -p app",
  "mysql -h db -P 3306 -u root -p",
  "mysql -u root -p < schema.sql; mkdir -pv out",
  "mysql -u root -p'' app",
]

# The same quote-aware value as `mysql-cli-password` above, for the same
# reason. The flag is `-p <pw>`, `-p=<pw>`, `--password <pw>`,
# `--password=<pw>` -- or `-p<pw>` attached, which every one of these
# tools' flag parsers accepts for a short flag and which the first draft
# of this rule did not reach (found by review of GH #244).
# `--password-stdin` is not a match: after `--password` the rule wants a
# space or an `=`, and `-p` cannot start inside `--`.
[[rule]]
name = "registry-login-password"
kind = "cli-password"
pattern = '''\b(?:docker|podman|nerdctl|buildah|skopeo|oras|helm[ \t]+registry)[ \t]+login\b[^\r\n|;&]*?[ \t](?:-p(?:[ \t]+|=)?|--password(?:[ \t]+|=))(?P<value>'[^'\r\n]+'|"[^"\r\n]+"|["']?[^\s"'`;|&<>]+)'''
# `<program> login`: never followed by a printable run, so it holds
# nothing -- the value is always past a space, which is GH #152's gap --
# and, unlike the bare program name, it cannot hold `docker-compose` at
# the buffer head either.
prefixes = [
  "docker login",
  "podman login",
  "nerdctl login",
  "buildah login",
  "skopeo login",
  "oras login",
  "helm registry",
]
positive = [
  "docker login -u ci -p hunter2GOESHERE registry.example.com",
  "docker login --username ci --password hunter2GOESHERE ghcr.io",
  "podman login -u ci -p 'hunter2GOESHERE' quay.io",
  "helm registry login registry.example.com -u ci -p hunter2GOESHERE",
  "docker login -u ci -phunter2GOESHERE ghcr.io",
  "docker login -u ci -p=hunter2GOESHERE ghcr.io",
  "docker login -u ci -p 'hunter2&GOES|HERE' ghcr.io",
]
negative = [
  "echo $TOKEN | docker login -u ci --password-stdin ghcr.io",
  "docker login -u ci registry.example.com",
  "docker run -p 8080:80 nginx",
  "oras login -u ci --password-stdin --plain-http localhost:5000",
]

# ---------------------------------------------------------- communication

[[rule]]
name = "slack-token"
kind = "slack"
pattern = '''\bxox[baprs]-[A-Za-z0-9-]{16,}'''
positive = ["xoxb-0123456789-0123456789012-ABCDEFGHIJ"]
negative = ["xoxb-0123"]

[[rule]]
name = "slack-webhook-url"
kind = "slack"
pattern = '''https://hooks\.slack\.com/services/T[A-Za-z0-9_]+/B[A-Za-z0-9_]+/[A-Za-z0-9_]{16,}'''
positive = [
  "https://hooks.slack.com/services/T00000000/B00000000/ABCDEFGHIJKLMNOPQRSTUVWX",
]
negative = ["https://hooks.slack.com/services/T0/B0/short"]

[[rule]]
name = "discord-webhook-url"
kind = "discord"
pattern = '''https://discord(?:app)?\.com/api/webhooks/[0-9]{17,20}/[A-Za-z0-9_-]{60,}'''
positive = [
  "https://discord.com/api/webhooks/01234567890123456789/ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789",
]
negative = ["https://discord.com/api/webhooks/0123/short"]

[[rule]]
name = "telegram-bot-token"
kind = "telegram"
pattern = '''\b[0-9]{8,10}:AA[A-Za-z0-9_-]{33}'''
positive = ["123456789:AAF0123456789abcdefghijABCDEFGHIJ01"]
negative = ["123456789:AAshort"]

[[rule]]
name = "sendgrid-api-key"
kind = "sendgrid"
pattern = '''\bSG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}'''
positive = [
  "SG.0123456789abcdefghijkl.0123456789abcdefghijklmnopqrstuvwxyz0123456789",
]
negative = ["SG.short.short"]

[[rule]]
name = "mailgun-api-key"
kind = "mailgun"
pattern = '''\bkey-[a-f0-9]{32}'''
positive = ["key-0123456789abcdef0123456789abcdef"]
negative = ["key-0123"]

[[rule]]
name = "resend-api-key"
kind = "resend"
pattern = '''\bre_[A-Za-z0-9_]{24,}'''
positive = ["re_0123456789abcdef01234567"]
negative = ["re_0123"]

# ---------------------------------------------------------------- payments

[[rule]]
name = "stripe-secret-key"
kind = "stripe"
pattern = '''\b(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{24,}'''
prefixes = ["sk_live_", "sk_test_", "rk_live_", "rk_test_"]
positive = ["sk_live_0123456789abcdef01234567"]
negative = ["sk_live_0123"]

[[rule]]
name = "stripe-webhook-secret"
kind = "stripe"
pattern = '''\bwhsec_[A-Za-z0-9]{32,}'''
positive = ["whsec_0123456789abcdef0123456789abcdef"]
negative = ["whsec_0123"]

# ----------------------------------------------------------- observability

[[rule]]
name = "sentry-org-token"
kind = "sentry"
pattern = '''\bsntrys_[A-Za-z0-9_.-]{40,}'''
positive = ["sntrys_0123456789abcdef0123456789abcdef01234567"]
negative = ["sntrys_0123"]

[[rule]]
name = "newrelic-api-key"
kind = "newrelic"
pattern = '''\bNR(?:AK|RA)-[A-Z0-9]{27}'''
prefixes = ["NRAK-", "NRRA-"]
positive = ["NRAK-0123456789ABCDEFGHIJKLMNOPQ"]
negative = ["NRAK-0123"]

[[rule]]
name = "launchdarkly-key"
kind = "launchdarkly"
pattern = '''\b(?:sdk|mob|api)-[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}'''
prefixes = ["sdk-", "mob-"]
positive = ["sdk-0123abcd-4567-89ef-0123-456789abcdef"]
negative = ["sdk-0123abcd"]

[[rule]]
name = "posthog-key"
kind = "posthog"
pattern = '''\bph[cx]_[A-Za-z0-9]{40,}'''
positive = ["phc_0123456789abcdef0123456789abcdef01234567"]
negative = ["phc_0123"]

[[rule]]
name = "honeycomb-key"
kind = "honeycomb"
pattern = '''\bhc[aw]ik_[A-Za-z0-9]{40,}'''
prefixes = ["hcaik_", "hcwik_"]
positive = ["hcaik_0123456789abcdef0123456789abcdef01234567"]
negative = ["hcaik_0123"]

[[rule]]
name = "datadog-api-key"
kind = "datadog"
pattern = '''(?i)dd_api_key["' \t]*(?::[ \t]*|=[ \t]*(?:\r?\n[ \t]+)?)["']?(?P<value>[a-f0-9]{32})'''
positive = ["DD_API_KEY=0123456789abcdef0123456789abcdef"]
negative = ["DD_API_KEY=nothex"]

# ----------------------------------------------------------------- generic

[[rule]]
name = "private-key-block"
kind = "private-key"
pattern = '''-----BEGIN[ A-Z]{0,20}PRIVATE KEY[ A-Z]{0,10}-----[\s\S]*?-----END[ A-Z]{0,20}PRIVATE KEY[ A-Z]{0,10}-----'''
prefixes = ["-----BEGIN"]
binary = true
positive = [
  "-----BEGIN RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQ==\n-----END RSA PRIVATE KEY-----",
]
negative = ["-----BEGIN CERTIFICATE-----"]

[[rule]]
name = "jwt"
kind = "jwt"
pattern = '''\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''
positive = [
  "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.dBjftJeZ4CVPmB92K27uhbUJU1p1r",
]
negative = ["eyJhbGciOiJIUzI1NiJ9.short"]

# `[ \t]+`, not `\s+` (GH #245): a line that ends in `Bearer` does not own
# the next line's first word, and a path like
# `crates/holdfast-core/src/output/redact.rs` is twenty bytes of this
# value class.
[[rule]]
name = "bearer-authorization"
kind = "bearer"
pattern = '''(?i)bearer[ \t]+(?P<value>[A-Za-z0-9._~+/-]{20,}=*)'''
positive = ["Authorization: Bearer abcdefghijklmnopqrstuvwxyz"]
negative = [
  "Bearer short",
  "the header is Authorization: Bearer\ncrates/holdfast-core/src/output/redact.rs:207:",
]

# `Authorization: Basic <base64 of user:password>` (GH #244) -- a curl
# `-v` trace, a `requests` header dict, an nginx `proxy_set_header`.
# Unlike `bearer-authorization` it is keyed on the header name, because
# `basic` followed by a word is ordinary English; the separator is
# optional so the config-file spellings (`Authorization "Basic …"`) are
# reached.
#
# **The refusal is a length test on a word, and both halves are needed.**
# RFC 7617 carries `user:password` in RFC 4648 base64, which is padded, so
# a complete credential is always a multiple of four bytes long and the
# refusal can never decline one. `Authorization: Basic authentication is
# required` offers `authentication`, fourteen bytes, and is refused for
# its length. A four-letter word passes that test --
# `Authorization: Basic auth is not supported` is marked -- so this
# settles most English after `Basic`, not all of it.
#
# **The refusal is also restricted to lower-case letters, and that half
# is for a credential still arriving, not for English.** A length test
# alone refuses a *growing* value three reads in four, and §4.1's scan
# only holds a refused candidate where a prefix-index entry below found
# it: on any other spelling the part that had arrived went out raw, up
# to every byte but the last (found by review of GH #244). Restricted to
# `[a-z]`, a partial value is refused only while every byte of it is a
# lower-case letter -- and the base64 of a real `user:` reaches an
# upper-case letter or a digit before it reaches the password: the colon
# itself encodes to `O` or `6` in two of the three positions it can take.
# `a_refused_basic_partial_never_decodes_into_the_password` measures that
# over common user names rather than this comment asserting it; allowing
# digits too was measured to break it (`nginx:` encodes to `bmdpbng6`).
# Upper-case or digit-bearing English after `Basic` is the cost, and it
# is a marker, not a leak. A refusal on *shape* alone -- "one lower-case
# word", with no length test -- was tried first and measured to drop the
# base64 of short lower-case pairs, which encode to lower-case letters
# more often than intuition says; with the length test beside it, no
# complete credential can be refused.
[[rule]]
name = "basic-authorization"
kind = "basic-auth"
pattern = '''(?i)\bauthorization\b["']?[ \t]*[:=]?[ \t]*["']?basic[ \t]+(?P<value>[A-Za-z0-9+/]{4,}={0,2})'''
# **Each index entry is a whole header spelling up to the value, and that
# is deliberate.** A context rule keeps §4.1's byte-class test (GH #152):
# a candidate is held while every byte after its prefix is printable.
# Indexed at `authorization` it would hold `Authorization:` at the buffer
# head -- ordinary `curl -v` output, one byte before the space that
# releases it -- and would protect nothing, because the space after the
# colon ends the run before a credential starts. Indexed at a full
# spelling, the prefix ends where the credential begins, so a credential
# still arriving *is* held and nothing else can be.
#
# So there is one entry per spelling, and they are the ones this rule's
# own positives and GH #244's rows use: an HTTP header with and without
# its space, a YAML or TOML value in either quote, JSON pretty and
# compact, a Python dict pretty and compact, nginx's `proxy_set_header`,
# and an `=` assignment. Matching is ASCII-case-insensitive. A spelling
# with other whitespace -- two spaces, a tab -- is not held, and the
# `[a-z]` half of the refusal is what bounds it.
prefixes = [
  "authorization: basic ",
  "authorization:basic ",
  "authorization: \"basic ",
  "authorization: 'basic ",
  "authorization\": \"basic ",
  "authorization\":\"basic ",
  "authorization': 'basic ",
  "authorization':'basic ",
  "authorization \"basic ",
  "authorization=basic ",
  "authorization = \"basic ",
  "authorization = 'basic ",
]
value_must_not_match = '''(?:[a-z]{4})*[a-z]{1,3}'''
positive = [
  "Authorization: Basic dXNlcjpodW50ZXIyR09FU0hFUkU=",
  "> authorization: basic YWRtaW46aHVudGVyMg==",
  "{'Authorization': 'Basic dXNlcjpodW50ZXIyR09FU0hFUkU='}",
  "{\"Authorization\":\"Basic dXNlcjpodW50ZXIyR09FU0hFUkU=\"}",
  "proxy_set_header Authorization \"Basic dXNlcjpodW50ZXIyR09FU0hFUkU=\";",
  "Proxy-Authorization: Basic dXNlcjpodW50ZXIyR09FU0hFUkU=",
]
negative = [
  # Refused for its length: one row per residue a length can leave, so
  # a refusal that forgot one of them is a red row rather than a quiet
  # marker (14 -> 2, 5 -> 1, 7 -> 3).
  "Authorization: Basic authentication is required",
  "Authorization: Basic realm",
  "Authorization: Basic invalid",
  "WWW-Authenticate: Basic realm=\"api\"",
  "Authorization: Basic <credentials>",
]

# **Both rules below judge what follows the separator, in two steps, and
# neither step costs a true positive over the corpus measured.** First
# they refuse a value whose first byte is another `:`; then
# `value_must_not_match` refuses a value that carries no digit *and*
# carries one of the bracket-and-quote bytes no credential alphabet
# uses. The first step is described immediately below and the second
# under "the value-side half" further down.
# The separator is
# already consumed by `[:=]` at that point, so a value opening on a second
# colon means the source text read `label::…` — a scope-resolution
# operator in Rust, C++, PHP and Perl, not an assignment. Measured over
# nine corpora (third-party Rust, crates.io READMEs, this repo's own
# `git log`, rendered man pages, colourised `grep -rn`, the Python 3.12
# stdlib, Debian licence texts, and this project's own docs and source),
# it removes 63% of this pair's matches on `git log` prose, 63% on this
# repo's own Rust, 53% on READMEs and 26% on the design docs, and takes
# the share of default-sized read windows the prefilter can skip entirely
# from 33% to 58% on this repo's source. It removes none of either rule's
# own positives, and none of a 32-row corpus of constructed real-shaped
# credentials.
#
# `powersync-token` above keeps the broad value class on purpose: it is
# label-keyed too, but its label is anchored to one vendor's name, so
# none of the nine corpora measured for #202 reaches it. That is a fact
# about those corpora and not a property of the rule -- its
# `[a-z0-9_.-]{0,24}` bridges the underscore, so `powersync_token::Name`
# inside a PowerSync codebase would reach it exactly as
# `secret::binding` reached the rules below.
#
# **What it gives up, stated rather than hidden -- two things.** First, a
# credential whose own first byte is `:` *however it is quoted or spaced*
# -- `["']?` consumes an opening quote and `\s*` a whitespace run
# including a newline, so `password=:hunter2`, `{"password":":hunter2"}`
# and the YAML spelling are one class -- is no longer redacted. No
# provider mints one and no fixture contains one, but the class is real
# and `tests/redaction_prose.rs` asserts every spelling of it as a
# documented limitation (REQ-TST-006).
#
# Second: **at the buffer tail this trades a marker for a shortened
# read.** Both rules carry a `value` group, so §4.1's partial-secret scan
# only disqualifies a candidate where the rule already sees a whole
# match; matching less means disqualifying less, so `holdback_boundary`
# moves *earlier* -- never later, which is the direction that would leak.
# An un-terminated echoed line now comes back truncated with
# `held_back: true` where it came back mangled, and `prompt.last_line`
# is `""` while it does. One byte outside the value class releases it.
#
# ------------------------------------------------ the value-side half
#
# **`value_must_not_match` closes #202's headline row, and it is written
# as a refusal rather than a requirement on purpose.** #202's own example
# -- ``reassembled the token: `get_screen_state` `` -- is a plain
# `label: value` with no second colon in it, so the rule above cannot
# see it; what distinguishes it from a credential is what the value
# *contains*. The expression reads: **a value that carries no digit and
# carries one of `( < > [ ] { } | \` or a backtick is not a credential.**
#
# **The refused set is exactly "bytes no *machine-generated token*
# alphabet contains", and it is deliberately narrower than "bytes that
# make code".** Walked one alphabet at a time: base64 (`+ / =`),
# base64url (`- _`), base62, base58, hex, crypt/bcrypt radix-64 (`. /`),
# UUID (`-`), PEM bodies and Azure's `~` -- none contains a bracket, a
# pipe, a backslash or a backtick, so refusing those costs nothing a
# provider can mint.
#
# **Human-chosen and generator-chosen *passwords* are the exception, and
# they are the documented limitation below rather than a gap here.** A
# password generator with a symbol set enabled can emit `(` or `{`;
# Django's `get_random_secret_key()` alphabet carries `_` and `(`
# outright. Every such generator this was checked against emits digits
# too, so the digit clause rescues them -- but a generator run with
# symbols on and digits off is a real configuration and its output is
# refused. That class is asserted in `tests/redaction_prose.rs`.
#
# **`_`, `.` and `:` were in this set and were taken out, which is the
# whole of what a review lane found.** They are the highest-yield bytes
# for prose -- they alone take third-party Rust from 1140 matches to 273
# -- and they are also the separators real credentials use. With them in,
# the refusal dropped **seven** rows of the credential corpus outright:
# both dot- and underscore-separated diceware passphrases
# (`correct.horse.battery.staple`, `correct_horse_battery_staple` --
# period and underscore are one-click separator options in 1Password,
# Bitwarden, KeePassXC and xkcdpass, and EFF wordlist words carry no
# digit by construction), a colon-separated one, a HashiCorp Vault
# `hvs.<base62>` token, a Doppler `dp.st.<base62>` token -- **neither of
# which has a shape-keyed backstop rule in this file** -- an underscore-
# bearing base64url value, and a dotted `SECRET_KEY`. A digit-free Vault
# token is about 1 in 68 by its own alphabet, which is not a rounding
# error. The narrower set drops **none** of them.
#
# **A digit anywhere rescues the value, and that clause is load-bearing.**
# Without it the refusal drops `password: <MySecretPass123>` and
# `auth_token = {abcdef1234567890}`, which are bracket-bearing and real.
#
# **Measured, nine credential-free corpora, 41,472 B windows (REQ-O-007),
# counting the spans `read_output` emits:** third-party Rust (syn/tokio/
# hyper/serde/regex/rmcp, 10.6 MiB) 1140 -> 331; the Python 3.12 stdlib
# (10.1 MiB) 61 -> 22; this project's own `.rs` (5.2 MiB) 114 -> 23; its
# docs (5.0 MiB) 55 -> 10; this repo's `git log` (1.2 MiB) 19 -> 12;
# crates.io READMEs (4.8 MiB) 9 -> 3; man pages, colourised `grep -rn`
# and Debian licence texts 0 -> 0. **When #202 landed it dropped none of
# the real-shaped credential corpus in `tests/redaction_prose.rs` and none
# of the positive fixtures the rules then carried.** Both have grown since;
# `every_credential_shape_the_label_only_rules_catch_is_still_caught` and
# `every_rule_matches_its_positives_and_rejects_its_negatives` are what
# keep that true, and neither needs a count written here to do it.
#
# **Why it is not upstream's expression, measured rather than asserted.**
# gitleaks' `generic-api-key` at the pinned `gitleaks-8.28.0` carries
# `entropy = 3.5`, 1,446 stopwords and an allowlist rejecting
# `^[a-zA-Z_.-]+$`, and both source files are byte-identical at v8.30.1
# -- so this is a divergence from the vendored rule's own design and not
# a stale snapshot. Run against that corpus as it stood at #202 (41
# rows), upstream's
# constraints **drop nineteen**: entropy 3.5 alone drops ten, including
# `export DB_PASSWORD=hunter2hunter2` (H=2.807) and
# `api_key: 's3cr3t-value'` (H=3.418), which are `positive` fixtures of
# these two rules; the stopword list drops four more, including
# `SECRET_KEY = 'django-insecure-...'` (a third shipped fixture, on
# `django`) and a Doppler token on `dev.` -- five in all. Entropy is the
# worse of the
# two on its own terms as well: over these corpora it is a proxy for
# value *length*, and it ranks `input.parse::<Token![struct]>(` (H=4.28)
# above the diceware passphrase `correcthorsebatterystaple` (H=3.36)
# that a high-entropy test is supposed to be the way to keep -- 13 of 15
# sampled digit-free code expressions outrank it. Upstream's allowlist
# regex fits this field verbatim and is the one piece that transfers in
# shape, but its *expression* leans on a value alphabet of `[\w.=-]` that
# this rule set does not have: over the same corpora it leaves 907 of the
# 1140 third-party-Rust matches standing while costing eleven true
# positives. A bare "the value must contain a digit", the constraint
# that looks obvious, costs thirteen.
#
# **What it gives up, and the class is real.** A digit-free credential
# carrying a bracket, a pipe, a backslash or a backtick --
# `api_key=alpha(bravo)charlie`, `SECRET_KEY=[bracketed-secret]` -- is no
# longer redacted. A password generator with symbols enabled *and* digits
# disabled can mint one; no provider does, and no shipped fixture is one.
# `tests/redaction_prose.rs` asserts the class as a documented limitation
# (REQ-TST-006) rather than leaving it to be rediscovered.
#
# **What it does NOT close, stated because the first draft of this block
# implied otherwise.** The residual on ordinary source is still
# substantial and is dominated by `_`- and `.`-bearing identifiers --
# `node.as_token`, `ProgressToken`, `self.dot2_token` -- and by a bare
# alphabetic value like `secret: SecretBytes`. Those are indistinguishable
# from a digit-free passphrase by anything in the value, so closing them
# means accepting the leak class above. 1140 -> 331 is a 71% cut and not
# a fix, and the 331 that remain are still very largely false. Turning
# the pair off entirely stays the operator's call (GH #128).
#
# **It also moves `holdback_boundary` earlier, for the same reason the
# colon refusal did.** `PrefixIndex::earliest_partial` releases a
# candidate once the rule's anchored form sees a whole match, on the
# ground that `find_spans` has redacted it; a refused value breaks that
# ground, so the scan asks `CompiledRule::anchored_whole_match` instead
# and keeps refused candidates in flight. Releasing them would hand out
# `API_KEY=abcdefgh` one byte before it becomes `abcdefgh9`.
#
# ------------------------------------ the two code shapes (GH #245)
#
# **GH #245 measured what those 331 were, and two shapes were most of
# them.** Both are now refused, by the second and third branches of the
# expression; the first branch is #202's, unchanged.
#
# * **A `::` path**: `pub paren_token: token::Paren`, `token: mio::Token`,
#   `secret_key: &crate::SecretKey` -- letters and `_` in segments joined
#   by `::`, optionally led by `&` or `*`. A path followed by a call or a
#   generic already carries a bracket, which the first branch refuses.
# * **A lower-case field access carrying an `_`**: `node.semi_token`,
#   `self.passwd.add_password` -- only lower-case letters, `.` and `_`,
#   with at least one of each separator. The `_` is what keeps it off the
#   diceware passphrase: every generator that offers `.` and `_` as
#   separators uses one of them per passphrase, and
#   `correct.horse.battery.staple` and `correct_horse_battery_staple` are
#   both still redacted. A dotted vendor token (`hvs.`, `dp.st.`) is not
#   reached either: its body is base62, which carries upper-case letters,
#   so `dp.st.dev_personal.<body>` is still redacted too.
#
# **Both are digit-free, like #202's branch, and that was a choice
# between two measured options.** Allowing digits in the `::` branch
# also refuses `uuid::Uuid::new_v4(` -- and a human's
# `Summer2024::Beach`. The digit is the one thing in a value that says a
# person chose it, so it keeps its veto on every branch.
#
# **What they still do not close.** A bare CamelCase type --
# `secret: SecretBytes`, `progress_token: ProgressToken` -- is a
# CamelCase passphrase by every test available to a regex, and stays
# redacted. So does anything carrying a digit (`node.dot2_token`,
# `uuid::Uuid::new_v4(`). The measured before-and-after is in the body of
# the pull request that closed GH #245 rather than here, because a count
# written into this file goes stale with the next rule and nothing reds
# when it does.
#
# **What they give up**, asserted in `tests/redaction_prose.rs` as
# documented limitations: a digit-free credential that is nothing but
# letters joined by `::`, and a digit-free credential of lower-case
# letters that mixes `.` and `_`.
#
# ---------------------------------- the separator (GH #245)
#
# **A label at the end of a line does not own the next line's first word
# any more.** The separator after `[:=]` was `\s*`, which crosses line
# breaks, so ssh's `password: ` followed by `Permission denied, please
# try again.` came back `[REDACTED:generic] denied`, and a line of prose
# ending in `token:` swallowed the path an `rg -n` printed under it.
#
# The separator is now horizontal whitespace, with **one** exception: an
# `=` may be followed by a line break when the next line is indented.
# That is how rustfmt and prettier wrap an assignment too long for one
# line -- `let token =` and then the literal, indented -- and a secret
# written into source is exactly that long. A `:` never crosses. Over the
# corpora GH #245 measured, every `:` that crossed into an indented line
# was a Python block (`if not have_password:` and the statement under
# it), and the one `=` that crossed was a wrapped assignment.
#
# **What that gives up, asserted in `tests/redaction_prose.rs`:** YAML's
# plain scalar on the line after its key (`password:` then an indented
# value), and a credential a prompt echoes on the line after it. The
# same separator is on every label-keyed rule in this file, and
# `bearer-authorization`'s `\s+` became `[ \t]+` for the same reason.
#
# **What it deliberately does not do.** The label-only match itself is
# unchanged where the value is credential-shaped: `password = not-set-yet`
# is still `[REDACTED:generic]`, which is the behaviour the 0.0.7
# CHANGELOG records under GH #125, and whether that stays is an
# operator's call (`disabled_redaction_rules`, GH #128) rather than this
# comment's. `powersync-token` above is label-keyed too and carries
# neither refusal; that is stated where the rule is and is unchanged
# here.

# Two-word `*_KEY` labels. Found by walking the providers that have no
# dedicated rule and checking each one's canonical environment-variable
# name against `generic-secret-assignment` below: every one of them is
# reached through `password|secret|api_key|access_token|auth_token|token`
# EXCEPT the `<something>_KEY` shape, because that rule's `secret\b` needs
# a word boundary and `SECRET_KEY` continues with `_`. So `SECRET_KEY=`
# (Django's canonical name), `CLERK_SECRET_KEY=`, `PRIVATE_KEY=`,
# `ENCRYPTION_KEY=` and `FCM_SERVER_KEY=` were reached by nothing at all.
#
# This is a label-keyed rule, not a shape-keyed one: it is correct by
# construction because it keys on the variable name rather than on a token
# format nobody can cite. `PUBLIC_KEY=` and `SECRET_KEY_FILE=` are the
# negatives that keep it from swallowing non-secrets.
[[rule]]
name = "secret-key-assignment"
kind = "generic"
pattern = '''(?i)\b[a-z0-9_.-]{0,32}(?:secret|private|encryption|signing|master|session|app)[_-]key\b["' \t]*(?::[ \t]*|=[ \t]*(?:\r?\n[ \t]+)?)["']?(?P<value>[^:\s"';,)][^\s"';,)]{7,})'''
prefixes = [
  "secret_key",
  "secret-key",
  "private_key",
  "private-key",
  "encryption_key",
  "encryption-key",
  "signing_key",
  "signing-key",
  "master_key",
  "master-key",
  "session_key",
  "session-key",
  "app_key",
  "app-key",
]
# See "the value-side half" above. Identical to the expression on
# `generic-secret-assignment`, deliberately: these two are one rule split
# by label, and a reader comparing them should find nothing to compare.
value_must_not_match = '''(?x)
    [^0-9]* [(<>\[\]{}|\\`] [^0-9]*
  | [&*]? [A-Za-z_]+ (?: :: [A-Za-z_]+ )+
  | &? [a-z_.]* (?: \. [a-z_.]* _ | _ [a-z_.]* \. ) [a-z_.]*
'''
positive = [
  "CLERK_SECRET_KEY=sk_test_0123456789abcdef01234567",
  "SECRET_KEY = 'django-insecure-0123456789abcdef'",
  "app.encryption_key: 0123456789abcdef",
  # Digit-free passphrases, in the three separator spellings password
  # generators actually offer. None of `-`, `.` or `_` is refused, and a
  # review lane found the first draft of this rule refusing the last two.
  "SESSION_KEY=qwertyuiopasdfgh",
  "MASTER_KEY=correct-horse-battery-staple",
  "MASTER_KEY=correct.horse.battery.staple",
  "MASTER_KEY=correct_horse_battery_staple",
  # GH #244: Laravel's `APP_KEY`, which is its encryption key.
  "APP_KEY=base64:dGhpcyBpcyBhIGxhcmF2ZWwga2V5IGZvciB0ZXN0cw==",
]
negative = [
  "SECRET_KEY_FILE=/run/secrets/app",
  "PUBLIC_KEY=0123456789abcdef",
  "SECRET_KEY=",
  "crate::secret_key::rotation",
  # GH #202's value-side half, on this rule's own label. Both carry a
  # refused byte and no digit, so the refusal declines them where the
  # pattern alone matches.
  "pub session_key: Option<SessionKey>,",
  "master_key = config.master_key.clone()",
  # GH #245: a `::` path, here led by a `&`.
  "secret_key: &crate::SecretKey,",
]

# The catch-all. `token` is in the alternation deliberately: without it an
# assignment to a bare `*_TOKEN` variable -- the shape Linode, Vercel,
# Postmark, Doppler and most one-off CI credentials take -- is covered by
# nothing at all, because their values carry no recognisable prefix.
[[rule]]
name = "generic-secret-assignment"
kind = "generic"
pattern = '''(?i)\b[a-z0-9_.-]{0,32}(?:password|passwd|passphrase|[_.-]pass|[_.-]pwd|secret|api[_-]?key|access[_-]?token|auth[_-]?token|token)\b["' \t]*(?::[ \t]*|=[ \t]*(?:\r?\n[ \t]+)?)["']?(?P<value>[^:\s"';,)][^\s"';,)]{7,})'''
prefixes = [
  "password",
  "passwd",
  "passphrase",
  "_pass",
  "_pwd",
  "secret",
  "apikey",
  "api_key",
  "api-key",
  "accesstoken",
  "access_token",
  "access-token",
  "authtoken",
  "auth_token",
  "auth-token",
]
# See "the value-side half" above.
value_must_not_match = '''(?x)
    [^0-9]* [(<>\[\]{}|\\`] [^0-9]*
  | [&*]? [A-Za-z_]+ (?: :: [A-Za-z_]+ )+
  | &? [a-z_.]* (?: \. [a-z_.]* _ | _ [a-z_.]* \. ) [a-z_.]*
'''
positive = [
  "export DB_PASSWORD=hunter2hunter2",
  "api_key: 's3cr3t-value'",
  "LINODE_TOKEN=0123456789abcdef0123456789abcdef",
  # A refused byte with a digit beside it is still a credential --
  # without the digit clause the refusal would drop this one.
  "auth_token = {abcdef1234567890}",
  # Digit-free: a passphrase is still a credential, and so is a
  # dot-prefixed vendor token with a digit-free body (HashiCorp Vault).
  "password=correcthorsebatterystaple",
  "access_token=hvs.CAESIJxKzWqTvNbMqLdFgHjKlPoIuYtReWqAsDfGhJkL",
  # GH #244: the `_PASS` and `_PWD` spellings, and a passphrase label.
  "DB_PASS=hunter2hunter2",
  "SMTP_PASS=hunter2hunter2",
  "export MYSQL_PWD=hunter2hunter2",
  "GPG_PASSPHRASE=correct-horse-battery",
  # A formatter that wraps a long assignment puts the value on the next
  # line, indented under it -- rustfmt and prettier both do -- and that
  # is the one line break the separator crosses (GH #245).
  "let token =\n    \"hunter2hunter2hunter2\";",
]
negative = [
  "password: short",
  "PASSWORD_FILE_PATH",
  "token = 1234",
  "the secret::binding flake cluster",
  "attach::secret::SecretBytes",
  # GH #202's headline row, and the two others the issue measured.
  "reassembled the token: `get_screen_state`",
  "export TOKEN={GITHUB}",
  "let cancellation_token = cancellation_token.clone();",
  # GH #245: a label at the end of a line does not own the next line's
  # first word when that line is not indented under it -- ssh's retry
  # prompt, and an `rg -n` hit under a line of prose.
  "dev@build-01's password: \r\nPermission denied, please try again.",
  "the window reassembled a mid-token:\ncrates/holdfast-core/src/output/redact.rs:207:",
  # GH #245: the two code shapes the value-side refusal gained -- a
  # `::` path and a lower-case field access carrying an `_` -- and each
  # with the reference or dereference that may lead it.
  "pub paren_token: token::Paren,",
  "semi_token: node.semi_token,",
  "token: &notification.progress_token,",
  "let secret = *config::DEFAULT_SECRET;",
  # GH #244: `pass` and `pwd` only count as a label behind a separator,
  # so `bypass` and the shell's own `PWD` and `OLDPWD` are not labels.
  "bypass=0123456789abcdef",
  "OLDPWD=/home/dev/repos/holdfast",
]

# --------------------------------------------------------- the group-3 walk
#
# Providers with no dedicated rule above, walked one by one and left to the
# two generic rules deliberately: Bitbucket, Azure, Linode, Vercel, Netlify,
# Heroku, Turso, Twilio, Square, PayPal, Auth0, Clerk, Firebase, WorkOS,
# Postmark, Doppler, Mistral, Cohere, Together, DeepSeek, Azure OpenAI,
# ElevenLabs, Deepgram, AssemblyAI, Weights & Biases, Cerebras, LangSmith,
# Voyage, Modal, AI21.
#
# None of them was given a shape-keyed rule, because none of their token
# formats can be cited from a primary source here, and a rule whose only
# evidence is the example written beside it proves the regex is
# self-consistent rather than that it matches a real credential.
#
# The walk was mechanical: each provider's canonical environment-variable
# name was run against `generic-secret-assignment`. All of them are reached
# except the `*_KEY` shape, which is why `secret-key-assignment` exists.
# One residual is left knowingly: `MODAL_TOKEN_ID` is reached by nothing,
# because `token` there is followed by `_ID` and the rule needs a word
# boundary. That value is an identifier, not the credential -- Modal's
# secret half is `MODAL_TOKEN_SECRET`, which is covered.
#
# Everything these two rules catch is reported as `[REDACTED:generic]`, not
# by provider name. A value pasted with no label at all is not redacted.
