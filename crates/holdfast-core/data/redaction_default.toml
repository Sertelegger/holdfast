positive = [
  "github_pat_11ABCDEFG0123456789_0123456789abcdefghijABCDEFGHIJ0123456789",
]
negative = ["github_pat_short"]

[[rule]]
name = "gitlab-pat"
kind = "gitlab"
pattern = '''\bglpat-[A-Za-z0-9_-]{20,}'''
