[package]
name = "holdfast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "holdfast"
path = "src/main.rs"

[dependencies]
holdfast-core = { path = "../holdfast-core" }
anyhow.workspace = true
libc.workspace = true
rmcp.workspace = true
serde_json.workspace = true
tokio.workspace = true
unicode-width.workspace = true

# NEW in 0.0.6 — `crates/holdfast` has had no `[dev-dependencies]` section
# through 0.0.5, deliberately: a binary crate's regular dependencies are
# visible to its integration tests, so nothing needed one until
# `attach_cli.rs` wanted a PTY *master* of its own. The shipped `holdfast
# attach` allocates no PTY — it uses the terminal it was given — which is
# why this is a dev-dependency and not a dependency.
[dev-dependencies]
portable-pty.workspace = true
# The banner's layout is only checkable by rendering it (see
# `attach_banner`); `holdfast-core` already uses this emulator for screen
# tracking, so it is the same one the product reasons with.
vt100.workspace = true
