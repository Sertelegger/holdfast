[package]
name = "holdfast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
# See `holdfast-core`'s manifest for why this path points above the package
# root: cargo copies the file in and normalises the field to `README.md`.
readme = "../../README.md"
categories = ["command-line-utilities", "development-tools"]
description = """\
MCP server and CLI giving AI agents persistent, PTY-backed shell sessions. \
A background daemon keeps sessions alive across client restarts, and \
attach/watch put a human at the same terminal. Early development.\
"""
# **`tests/daemon_cli.rs` cannot compile from a tarball.** It carries
# `include_str!("../../holdfast-core/tests/fixtures/example_config.toml")`,
# which reaches into the sibling package -- a path `cargo package` cannot
# follow, because it copies nothing from above the package root. The file
# would ship naming a file that is not there, and the failure is a compile
# error rather than a red test. `cargo package`'s verification build does
# not compile tests, so nothing in the publish path would have reported it.
exclude = ["/tests"]

[[bin]]
name = "holdfast"
path = "src/main.rs"

[dependencies]
holdfast-core.workspace = true
anyhow.workspace = true
libc.workspace = true
rmcp.workspace = true
serde_json.workspace = true
tokio.workspace = true
unicode-width.workspace = true

# NEW in 0.0.6 — `crates/holdfast` has had no `[dev-dependencies]` section
# through 0.0.5, deliberately: a binary crate's regular dependencies are
# visible to its integration tests, so nothing needed one until
# `attach_cli.rs` wanted a PTY *master* of its own. The shipped `holdfast
# attach` allocates no PTY — it uses the terminal it was given — which is
# why this is a dev-dependency and not a dependency.
[dev-dependencies]
# NEW in 0.0.10a — `worker_process.rs` binds a real `WorkerSocket` under a
# private runtime directory, and the socket tests in `holdfast-core` already
# reach for the same crate for the same reason. `/tmp` by hand is not a
# substitute: `sockaddr_un.sun_path` is 108 bytes and a leaked directory is
# a leaked socket the next run binds beside.
tempfile.workspace = true
portable-pty.workspace = true
# The banner's layout is only checkable by rendering it (see
# `attach_banner`); `holdfast-core` already uses this emulator for screen
# tracking, so it is the same one the product reasons with.
vt100.workspace = true
