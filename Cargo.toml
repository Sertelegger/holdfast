[workspace]
members = ["crates/holdfast-core", "crates/holdfast"]
resolver = "2"

[workspace.package]
version = "0.0.7"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Sertelegger/holdfast"
# Same URL as `repository`, and kept because **both 0.0.0 name
# reservations already set it** -- dropping a field the published crate
# has today would read as a deliberate removal.
homepage = "https://github.com/Sertelegger/holdfast"
# **`readme` is deliberately absent here and set per crate.** An inherited
# `readme` resolves against the workspace root, and `README.md` sits outside
# both package directories -- `cargo package` copies nothing from above the
# package root, so the inherited path would name a file the tarball cannot
# contain. Each crate points at its own.
keywords = ["mcp", "pty", "terminal", "shell", "agent"]

[workspace.dependencies]
# **The intra-workspace dependency, and the one version string that is not
# the one above.** crates.io rejects a path-only dependency, so `holdfast`'s
# edge to `holdfast-core` has to carry a literal version; there is no
# `version.workspace` inside a dependency spec to inherit `0.0.7` from
# `[workspace.package]`. **CONTRIBUTING.md's release step 4 names both**,
# because proximity is not a mechanism: the two literals are twenty-odd lines
# apart with this comment between them, and an earlier draft of this note
# claimed six.
#
# A stale literal here fails no build and no test -- the workspace still
# resolves the dependency by path, so everything local stays green, and only
# the *published* `holdfast` binds to an older `holdfast-core` already on
# crates.io. `release.yml`'s `crates-io` job refuses to publish when the tag,
# this literal and the version above disagree -- **but that check sits behind
# the same missing-token gate as the publish it guards.** Until a
# `CARGO_REGISTRY_TOKEN` exists nothing in this repository catches a stale
# literal, and CONTRIBUTING.md's release step 4 is the whole defence.
holdfast-core = { path = "crates/holdfast-core", version = "0.0.7" }

anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
ciborium = "0.2.2"
libc = "0.2.189"
parking_lot = "0.12"
jsonschema = { version = "0.56.0", default-features = false }
portable-pty = "0.9.0"
regex = "1.13.1"
regex-automata = { version = "0.4.18", default-features = false, features = ["std", "syntax", "dfa-build", "dfa-search", "unicode-case", "unicode-perl"] }
rmcp = { version = "3.1.2", features = ["transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "signal", "sync", "time"] }
toml = "1.1.4"
unicode-width = "0.2.2"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16.2"

# **The two crates that build GH #142's liveness automata, optimized even in
# a debug build.** `PrefixIndex::build` runs once per `OutputProcessor` and a
# `holdfast-core` test builds one per row, so the unoptimized figure lands on
# every test and on every daemon a CLI test starts. Measured on this tree,
# with the override and without it: `PrefixIndex::build` 77 ms against
# 1.28 s, and `cargo test -p holdfast-core --lib` 29 s against 145 s.
# Nothing about the shipped binary changes; `--release` already optimized
# both.
[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3
