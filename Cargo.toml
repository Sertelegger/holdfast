[workspace]
members = ["crates/holdfast-core", "crates/holdfast"]
resolver = "2"

[workspace.package]
version = "0.0.7"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Sertelegger/holdfast"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
ciborium = "0.2.2"
libc = "0.2.189"
parking_lot = "0.12"
jsonschema = { version = "0.55.0", default-features = false }
portable-pty = "0.9.0"
regex = "1.13.1"
regex-automata = { version = "0.4.18", default-features = false, features = ["std", "syntax", "dfa-build", "dfa-search", "unicode-case", "unicode-perl"] }
rmcp = { version = "3.1.2", features = ["transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "signal", "sync", "time"] }
toml = "1.1.4"
unicode-width = "0.2.2"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16.2"

# **The two crates that build GH #142's liveness automata, optimized even in
# a debug build.** Determinizing fifty-one DFAs is 1.29 s unoptimized against
# 66 ms optimized, `PrefixIndex::build` runs once per `OutputProcessor`, and a
# `holdfast-core` test builds one per row — so the unoptimized figure lands on
# every test and on every daemon a CLI test starts. Measured: the `--lib`
# suite 156 s -> 32 s, `--test redaction_sweep` 662 s -> 66 s, and
# `daemon_cli` 10.5 s -> 2.6 s, which is under its pre-#142 time. Nothing
# about the shipped binary changes; `--release` already optimized both.
[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3
