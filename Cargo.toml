[workspace]
members = ["crates/clasp-core", "crates/clasp"]
resolver = "2"

[workspace.package]
version = "0.0.2"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Sertelegger/clasp"

[workspace.dependencies]
anyhow = "1.0.104"
libc = "0.2.189"
parking_lot = "0.12"
jsonschema = { version = "0.49.9", default-features = false }
portable-pty = "0.9.0"
regex = "1.13.1"
rmcp = { version = "3.1.2", features = ["transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
