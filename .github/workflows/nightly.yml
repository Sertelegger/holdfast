# Holdfast nightly tier.
# Plan: docs/superpowers/plans/2026-08-12-holdfast-ci-and-verification-harness.md
#
# Named for the TIER, not for the flake hunt. REQ-TST-004 (tier-4
# adversarial/property/stress) belongs here when the milestones that write
# it land; the flake hunt is the first tenant, not the purpose.
#
# Same constraints as ci.yml: nothing publishes, nothing authenticates,
# no continue-on-error, every `uses:` SHA-pinned, persist-credentials false.
#
# Pinned inputs:
#   runner image    ubuntu-24.04
#   rust toolchain  channel "1.97" — from rust-toolchain.toml, the ONLY pin
#   actions/checkout            v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   Swatinem/rust-cache         v2.9.2  6323deb102c322ba6fcbdcafc7e3dddab59af2b6
#   actions/setup-python        v7.0.0  5fda3b95a4ea91299a34e894583c3862153e4b97
#   python                      3.13    (minor series; see ci.yml's probe job)

name: Nightly

on:
  schedule:
    # 10:17 UTC daily.
    #
    # GitHub Actions cron is UTC ONLY -- there is no timezone field and no
    # DST adjustment. This is 03:17 US/Pacific in summer and 02:17 in
    # winter; for a nightly job that drift is irrelevant, and it is written
    # down here so nobody "fixes" an hour that looks wrong.
    #
    # :17 rather than :00 on purpose: GitHub documents that scheduled runs
    # can be delayed under load and recommends avoiding the top of the hour.
    #
    # A scheduled workflow only fires from the DEFAULT BRANCH. This file
    # does nothing until it is merged there.
    #
    # **Weekly, not nightly, and the name now overstates the cadence on
    # purpose.** The tier keeps its name because REQ-TST-004's tier-4
    # content still belongs here; what changed is the bill. At ~14 min a
    # run, daily was ~417 min/month against an account-wide 2000 min free
    # tier that this repository exhausted on the 25th. Weekly is ~60.
    #
    # **The trade-off is real and is not a drift argument, and it is paid
    # rather than accepted.** Most of what a scheduled job re-runs on an
    # unchanged tree can only catch runner or toolchain drift, for which
    # weekly is plenty — but a flake hunt is the exception, because
    # repetition IS the measurement. Weekly at the old count would have
    # dropped monthly samples from ~600 to ~87, and the sensitivity that
    # buys is currently pointed at GH #42, which is NOT believed to be a
    # simple flake: the hypothesis is that a rescan reads the session
    # buffer rather than confirming the reader has caught up, which would
    # make `wait_for_pattern` answer `SessionDied` over output a real
    # child produced. Cutting the sampling rate 7x on the one job that
    # would catch that is the wrong direction.
    #
    # So the repetition count rises with the cadence and the monthly
    # sample count stays flat: 4.33 runs x 140 = ~606, against 30 x 20 =
    # ~600. Each run pays the setup once instead of thirty times, which is
    # where the saving comes from — ~346 min/month against ~423, smaller
    # than the cadence alone would suggest and honest about it.
    - cron: "17 10 * * 0"
  # So the job can be exercised on demand during Task 7 without waiting a
  # day. This is NOT a substitute for the schedule -- a workflow_dispatch-
  # only job nobody dispatches is a job that cannot fail.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Read by ci-flake-hunt.sh, which asserts its own parallelism exceeds it.
  TEST_THREADS: "4"

jobs:
  flake-hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # HOLDFAST_REQUIRE_ALL_SHELLS: "1" is STILL not set, and ci.yml's `test`
    # job carries the measurement that says why: the fish row cannot pass
    # on either fish version obtainable on this image, so the variable
    # would make this job fail on iteration 1, every night, on a defect
    # that has nothing to do with the race it exists to hunt. A nightly
    # that is red for a known reason is a nightly nobody reads.
    #
    # WHOEVER MAKES THE FISH ROW PASS MUST FLIP IT HERE TOO — this file and
    # ci.yml both, or the coverage gate is half-applied.
    #
    # env:
    #   HOLDFAST_REQUIRE_ALL_SHELLS: "1"
    #
    # ci.yml's skip census is deliberately NOT repeated here: it reads one
    # suite log and the hunt produces twenty, and every push already runs
    # it. What this job needs is that the same ROWS run — which is a
    # property of the host, and ci-probe.sh below asserts it (including the
    # CPython >= 3.13 the PyREPL row needs) before the first iteration.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the shells and helpers the test suite spawns by name
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zsh dash less python3
      # Without this the flake hunt repeats a configuration in which the
      # §8.7 PyREPL row never runs: ubuntu-24.04's own python3 is 3.12.3,
      # whose readline REPL drives no bracketed paste. See ci.yml's probe
      # job for the full reason and for why the pin is a minor series.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup show active-toolchain && rustc --version
      # save-if: false because a nightly run should read whatever cache
      # exists and never write over it — a scheduled job that writes the
      # shared cache is a scheduled job that can slow every push, and cache
      # space is a 10 GB shared budget.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: nightly
          save-if: false
      - run: ./scripts/ci-probe.sh
      # 140, not the script's default 20: see the sampling note on the
      # schedule above. At the measured ~0.5 min an iteration this lands
      # near 80 min, inside the 180 min cap with room for the suite to
      # keep growing.
      - run: ./scripts/ci-flake-hunt.sh 140
