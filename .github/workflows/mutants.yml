# Holdfast monthly mutation sweep.
# Plan: docs/superpowers/plans/2026-08-12-holdfast-ci-and-verification-harness.md Task 6.
#
# holdfast-core AND holdfast -- see the shard-calibration comment below for why
# holdfast-core-only stopped being the right scope (0.0.5 milestone review,
# finding I-18: crates/holdfast/src/commands.rs holds `daemon stop --force`'s
# SIGKILL confirmation, the exit codes, and the /proc liveness evidence, and
# was never mutation-tested by any scheduled job). NEVER on the push path --
# a sweep is hours, and a per-push sweep is the first thing anyone disables.
#
# Pinned inputs:
#   runner image    ubuntu-24.04
#   rust toolchain  channel "1.97" — from rust-toolchain.toml, the ONLY pin
#   actions/checkout            v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   Swatinem/rust-cache         v2.9.2  6323deb102c322ba6fcbdcafc7e3dddab59af2b6
#   actions/upload-artifact     v7.0.1  043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/setup-python        v7.0.0  5fda3b95a4ea91299a34e894583c3862153e4b97
#   python                      3.13    (minor series; see ci.yml's probe job)
#   cargo-mutants               27.1.0  resolved and measured by run 31747269472

name: Mutants

on:
  schedule:
    # 11:41 UTC on the 1st of each month. UTC only; see nightly.yml
    # for the note.
    #
    # **Monthly, not weekly, and the reason is the bill rather than the
    # engineering.** At ~175 min a run this job cost 43% of the account's
    # entire 2000 min/month free tier and exhausted it on the 25th, taking
    # every other repository's CI down with it. Weekly was 4.33 runs =
    # ~759 min/month; monthly is ~175.
    #
    # **Day-of-month, and NOT `1-7 * 6` for "first Saturday".** POSIX cron
    # ORs a restricted day-of-month with a restricted day-of-week instead
    # of ANDing them, and GitHub follows POSIX. `41 11 1-7 * 6` therefore
    # fires on days 1-7 *and* on every Saturday — enumerated, 10 runs in
    # 2026-09, 11 in 2026-10 — which is ~1800 min/month, a 2.4x INCREASE
    # over the weekly schedule it was written to replace. It read as a
    # saving and was a regression.
    #
    # A true first-Saturday needs day-of-month `*` and the day filter in
    # the job, which pays a runner start every week to skip. The weekday
    # was never load-bearing for a sweep nobody watches live, so this
    # picks a fixed date instead and gets exactly one run.
    #
    # **What that costs in coverage, stated rather than glossed.** One
    # shard of eight runs per invocation, so a full sweep went from 8
    # weeks to 8 months. That is only acceptable because the value of a
    # sweep is in *reading* the survivors, and an unread sweep is spend
    # with no return. Before a milestone, dispatch the shards deliberately
    # with the input below rather than waiting for the calendar.
    - cron: "41 11 1 * *"
  workflow_dispatch:
    inputs:
      shard:
        description: "Shard to sweep, 0-7. Empty rotates by month."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mutants
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  mutants:
    runs-on: ubuntu-24.04
    # 350 rather than 360: GitHub's own hard cap for a hosted job is 6
    # hours, so a job asking for exactly 360 is a job that will be killed by
    # the platform rather than by its own timeout, with a less legible
    # message. Ten minutes of headroom makes the timeout ours.
    timeout-minutes: 350
    # **The calibration exemption is spent.** This job carried
    # `continue-on-error: true` under a `CALIBRATION-EXEMPT-UNTIL: 2026-09-09`
    # marker, which `ci-hygiene.sh` honours with a strict `<` — so the last
    # exempt day was 2026-09-08 and the ban would have started firing on the
    # 9th, turning `hygiene` red on every push and pull request. It is removed
    # here rather than on the deadline, because `hygiene` is about to become a
    # required status check and a dated fuse under a required check is a dated
    # merge freeze.
    #
    # The consequence is deliberate and is the point of the exemption expiring:
    # a sweep that finds a surviving mutant is now a RED job rather than a
    # green one with the finding buried in an artifact. That is the correct
    # signal — a survivor is a test that cannot fail, which is this project's
    # defining defect class.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the shells and helpers the test suite spawns by name
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zsh dash less python3
      # The same interpreter ci.yml installs, for the same reason: without
      # it the §8.7 PyREPL row does not run, and a sweep whose baseline
      # skips a row reports every mutant only that row could kill as
      # MISSED. A calibration measured against a different suite than CI
      # runs is a calibration of something else.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup show active-toolchain && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: mutants
          save-if: false
      # Pinned. The first run (31747269472, 2026-08-13) resolved 27.1.0 and
      # that is what every measurement in .cargo/mutants.toml was taken
      # against; an unpinned tool is a second mutable pointer alongside the
      # action SHAs. `cargo mutants --version` below is the receipt.
      - run: cargo install --locked cargo-mutants@27.1.0
      - run: cargo mutants --version
      # cargo-mutants reads .cargo/mutants.toml. A file named mutants.toml
      # at the repository root -- which is what the plan's file table asked
      # for -- is IGNORED COMPLETELY: measured 464 mutants with it, without
      # it, and with a deliberately different exclude_globs. So assert both
      # halves: the real config is where the tool looks, and no inert decoy
      # has reappeared at the root for someone to edit in good faith.
      - run: test -f .cargo/mutants.toml && test ! -e mutants.toml
      # ONE SHARD PER WEEK, rotating; the whole (now two-package) scope
      # every eight weeks.
      #
      # RE-CALIBRATED 2026-08-18 (0.0.5 milestone review, finding I-18).
      # Two things were wrong with the previous calibration, not one:
      #
      # 1. SCOPE. holdfast-core only, so crates/holdfast/src/commands.rs --
      #    `daemon stop --force`'s SIGKILL confirmation, the exit codes, the
      #    /proc liveness evidence -- was never mutation-tested by any
      #    scheduled job. Fixed by adding `--package holdfast` below.
      #
      # 2. CALIBRATION was stale. Measured: 464 mutants on 2026-08-13, 1110
      #    (holdfast-core only) on 2026-08-17, and run 31883173007 was
      #    CANCELLED at the 350-minute timeout on 2026-08-15 having produced
      #    no verdict at all. 0.0.5 then added 10,652 lines to
      #    crates/{holdfast-core,holdfast}/src after the 08-17 measurement, so the
      #    3-way, holdfast-core-only shard math was already wrong by the time
      #    anyone would next read it.
      #
      # Re-measured 2026-08-18, `cargo mutants --list` (cheap -- it doesn't
      # build or run anything), against HEAD b5a8393 with four files
      # (daemon/server.rs, mcp/shim.rs, protocol/client.rs,
      # protocol/method.rs) mid-edit by other in-flight work at the moment
      # of measurement:
      #   holdfast-core .................................... 1742 mutants
      #   holdfast ............................................ 47 mutants
      #   combined (both --package flags, one invocation) . 1789 mutants
      # cargo-mutants reads the working tree, not a commit, and the total
      # moved by several mutants within this same calibration session as
      # other lanes committed -- this is a snapshot against a growing
      # codebase, not a fixed point, the same way 464/1110 above were.
      #
      # RATE, from the two real timed runs, not a guess:
      #   run 31751264509 (2026-08-13) COMPLETED (job conclusion "failure" --
      #     mutants were caught; continue-on-error made the WORKFLOW show
      #     "success," which is worth remembering next time this comment is
      #     trusted at a glance): 464 mutants, job wall time 22:45:57 to
      #     01:33:15 = 167.3 min -> 2.77 mutants/min.
      #   run 31883173007 (2026-08-15) was CANCELLED at 350.4 min having
      #     processed 458 of that day's 1080 mutants (caught.txt + missed.txt
      #     + timeout.txt + unviable.txt line counts, from the uploaded
      #     mutants-out-31883173007 artifact, which is non-empty precisely
      #     because a cancelled sweep still flushes partial progress -- see
      #     "WHAT THIS ARTIFACT DOES NOT TELL YOU" on the upload step
      #     below) -> 1.31 mutants/min.
      # The two rates disagree by >2x: GitHub-hosted runners are shared
      # hardware and this job has exactly two real data points. The SLOWER
      # figure (1.31/min, i.e. 0.765 min/mutant) is what the shard count
      # below is sized against; the faster one is upside, not the plan.
      #
      # FIXED COST CHECK -- more shards is not automatically a fix, and
      # would not be one if a full build dominated each shard's time. It
      # doesn't here: the job runs exactly ONE shard per scheduled invocation, not
      # all N in sequence, so the ~2-minute fixed setup (checkout, apt-get,
      # toolchain, rust-cache, cargo install cargo-mutants, baseline build --
      # measured needing 2m02s total before the mutants step started, on
      # 2026-08-13's smaller tree) is paid once per week regardless of N; it
      # does not multiply the way N builds inside one job would. And it was
      # ~1% of that run's 167.3-minute total, so it is not the cost being
      # divided when N changes. Raising N is a real fix here.
      #
      # SHARD COUNT: 8, up from 3. `--shard k/n` partitions the generated
      # set; verified 2026-08-18 against the same HEAD as the counts above:
      # 0/8 through 6/8 list 224 mutants each and 7/8 lists 221, summing to
      # exactly 1789 -- no mutant dropped, none run twice (checked with a
      # byte-exact dedup across all eight lists; `sort -u` alone, under this
      # shell's default locale, under-counts distinct mutant lines by
      # collating away punctuation, which looks exactly like a sharding bug
      # and is not one -- use `sort | uniq -c` if re-verifying this).
      #
      # Projected runtime at 224 mutants/shard: 83 min at the fast rate, 176
      # min at the slow one it's sized against -- 24%-50% of the 350-minute
      # budget. Growth headroom at the slow rate before this shard size
      # reaches the cap again: ~2x (max sustainable shard ~451 mutants at
      # 0.765 min/mutant net of fixed cost). That is deliberately less
      # generous than it could be: full-scope coverage was every 3 weeks and
      # is now every 8, and pushing N higher to buy more growth headroom
      # trades directly against that -- "finding survivors in code NOBODY
      # HAS TOUCHED" (below) gets slower to complete the wider N gets. 8 was
      # chosen so a single further doubling -- the same magnitude as the
      # 08-13-to-08-17 measurement -- does not immediately reopen this
      # finding.
      #
      # Why not `--in-diff`, which is the obvious answer: every task in this
      # project already runs a manual mutation sweep over its own diff, and
      # that is where essentially every mutation finding has come from. The
      # unique value of the scheduled job is finding survivors in code
      # NOBODY HAS TOUCHED -- which is exactly what a diff-scoped run cannot
      # do. Sharding keeps that property; `--in-diff` would have made the
      # job a slower duplicate of work already done.
      #
      # The rotation is by MONTH so it needs no state. `--no-shuffle` and
      # the pinned tool version keep shard membership stable between runs,
      # so month N+8 re-runs the same ~224 mutants unless the code moved.
      #
      # **Months since epoch, and the naked month index it replaced was
      # worse than the ISO week it replaced.** `date +%V % 8` under a
      # first-Saturday cron picks shard 5 six times and shard 3 once over
      # 24 months. But `(month - 1) % 8` is not a fix: a calendar month
      # wraps at 12 against a modulus of 8, so driven once a month it
      # NEVER completes a cycle — shards 0-3 land four times in 24 months
      # and 4-7 twice, half the mutation surface swept once a year, and a
      # September start covers four shards in eight months. `year * 12 +
      # month` does not wrap, and is exactly uniform: every shard three
      # times in 24 months, a full sweep every eight.
      #
      # An explicit `shard` input wins, so a milestone sweep can walk 0..7
      # without waiting eight months for the calendar to do it.
      # Through `env:` rather than `${{ }}` interpolation into the script
      # body: an expression is pasted in before the shell sees the line, so
      # a crafted input would be shell syntax rather than a value. Only a
      # dispatcher with write access can set it, which lowers the severity
      # and does not change the shape.
      - env:
          SHARD_INPUT: ${{ inputs.shard }}
        run: |
          shard="${SHARD_INPUT}"
          case "${shard}" in
            "" | [0-7]) ;;
            *) echo "shard must be 0-7 or empty, got: ${shard}" >&2; exit 1 ;;
          esac
          if [ -z "${shard}" ]; then
              shard=$(( ( $(date -u +%Y) * 12 + $(date -u +%-m) - 1 ) % 8 ))
            echo "$(date -u +%Y-%m) -> shard ${shard}/8"
          else
            echo "dispatched shard ${shard}/8"
          fi
          cargo mutants --package holdfast-core --package holdfast --no-shuffle \
            --jobs 2 --shard "${shard}/8" -- --locked
      # mutants.out/ is the only durable evidence this job produced anything.
      # `if-no-files-found: error` is what stops a sweep that produced
      # nothing from uploading nothing and looking identical to a clean one.
      #
      # WHAT THIS ARTIFACT DOES NOT TELL YOU: whether the sweep finished.
      # Confirmed against run 31883173007's own upload -- cargo-mutants
      # flushes outcomes.json/caught.txt/missed.txt incrementally, so a
      # sweep CANCELLED by `timeout-minutes` still has a non-empty
      # mutants.out/ at the moment it is killed, and `if: always()` still
      # runs this step and still uploads it. A completed-clean run and a
      # timed-out one both produce an artifact this check accepts; do not
      # read "an artifact exists" as "a verdict exists."
      # What DOES distinguish them, and is not masked by continue-on-error
      # (which only ever turns a FAILURE conclusion into a reported
      # success, never a CANCELLED one): the run's own conclusion --
      #   gh run list --workflow mutants.yml --json conclusion --limit 5
      # reads "success" for a clean sweep or a still-masked survivor-found
      # sweep (indistinguishable from each other until 2026-09-09, by
      # design -- see the continue-on-error comment above), and reads
      # "cancelled" for a timeout with no verdict. That is the check;
      # artifact presence alone is not.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-out-${{ github.run_id }}
          path: mutants.out/
          retention-days: 30
          if-no-files-found: error
