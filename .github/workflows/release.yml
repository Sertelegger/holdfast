# RELEASE-WORKFLOW: tag-triggered publishing
#
# Holdfast's release. **The changelog is the release and this file is the
# messenger** — it publishes the section of CHANGELOG.md that bears the tag's
# version and adds nothing of its own. Release prose is not in the repository,
# is not reviewed with the code, and does not survive the repository being
# recreated; a section under version control is all three.
#
# Constraints this file is held to (enforced by scripts/ci-hygiene.sh):
#   * the `RELEASE-WORKFLOW:` marker above is **verified, not believed**: the
#     `on:` block must name `tags:` and may name **nothing but `push:` and
#     `tags:`**. That is what makes the publishing capability safe to grant —
#     nothing but somebody tagging a commit on purpose can start this. It was
#     a denylist of four triggers until the commit that added binary assets,
#     and `workflow_dispatch:` walked straight through it; that sentence was
#     therefore true of four spellings and false of at least three others.
#   * no `continue-on-error`, no retry action — a release that half-happened
#     and reported success is worse than one that failed
#   * every `uses:` pinned to a 40-hex commit SHA
#   * `persist-credentials: false`; the token this job needs is passed
#     explicitly to the one step that needs it
#   * never a `-latest` runner image. **This line used to read "`runs-on:
#     ubuntu-24.04`, never ubuntu-latest", and that stopped being true when
#     the build matrix landed** — three of the five §12.1 assets need a
#     macOS or Windows runner, so the images are now `ubuntu-24.04`,
#     `macos-15`, `macos-15-intel` and `windows-2022`. All pinned; the
#     hygiene rule was only ever about the mutable alias, and the narrower
#     sentence was this file describing itself rather than the rule.
#     (`macos-14`, which `ci.yml`'s `macos-native` still pins, is deprecated
#     upstream and there is no `macos-13` label at all any more.)
#   * explicit timeout-minutes
#
# **`gh` rather than a release action**, deliberately: it is preinstalled on
# the runner, so this adds no third-party dependency to pin, review and watch
# for compromise on the one workflow that holds a write token.
#
# **Binary assets, published as a DRAFT.** This file used to say "no binary
# assets", on the argument that §12.3's binding event is *first external
# distribution* and that several deliberate escapes — the wire-shape record's
# in-place corrections most of all — are conditioned on it not having
# happened. That argument is still correct and is why the `--draft` below is
# not a convenience. It is the mechanism that keeps the two things apart:
#
#   * **Building and attaching the assets is automation.** It happens on every
#     tag, and it is what makes the project installable at all — measured
#     before this change, all three shipped releases had zero assets, crates.io
#     held a 0.0.0 name reservation whose own lib.rs says it "contains no
#     usable code", and the §13 plugin layer did not exist. The only install
#     path was building from source and nothing said so.
#   * **Promoting the draft is the decision.** A draft's assets are not served
#     from `releases/download/<tag>/<asset>`, so nothing has reached anyone
#     and §12.3's event has not occurred. The escapes named above survive
#     until a human runs `gh release edit <tag> --draft=false`, and THAT is
#     the moment they stop being allowed — `crates/holdfast-core/tests/
#     wire_shape.rs`'s in-place golden rewrite and `protocol/method.rs`'s
#     "the latitude ends at the first published binary" both have to be
#     revisited in the same act, not after it.
#
# So the capability lands here and the event stays a decision, which is what
# `CONTRIBUTING.md` said the shape of this should be.
#
# **A-4 is the trust root and `SHA256SUMS.txt` is half of it.** The spec:
# *"The bootstrap launcher fetches binaries from GitHub Releases over TLS;
# the SHA256SUMS file fetched alongside establishes integrity but not
# independent authenticity (sigstore/cosign is post-v0.1.0)."* §13.3 step 5
# has the launcher fetch exactly `releases/download/vX.Y.Z/SHA256SUMS.txt`
# and verify the archive against it before extracting, so that file is not a
# courtesy: it is the artifact the install path is built on, and it must
# cover every archive the release carries.
#
# **HOW THIS FILE IS TESTED, AND WHAT IS LEFT OVER.** A release workflow
# cannot be tested by releasing, and the trigger rule above forbids the
# pull-request hatch, so the build/pack/checksum/verify path lives in
# `scripts/package-release.sh` and `scripts/verify-release-archive.sh` and
# `.github/workflows/release-rehearsal.yml` runs those same scripts on all
# five targets on every pull request. Every step in the `build` job below and
# every step in `publish` up to and including the verification loop is a line
# that file also runs.
#
# **The same argument applied to the release BODY, which is where it had not
# been.** Composing the notes was inline YAML, and its empty-section guard was
# therefore untested — and, it turned out, untestable, because it ran after
# the step had already appended 2.6 KB to the file it was checking. That logic
# is now `scripts/release-notes.sh`, its fixtures run as `--self-test` in
# `ci.yml`'s `hygiene` job rather than in the rehearsal, and the reason for
# that placement is `verify-release-archive.sh`'s: the rehearsal is not among
# the required status checks and `hygiene` is, and these fixtures need no
# build and no runner matrix.
#
# **The residual is exactly one command: `gh release create`.** Nothing in
# this repository can exercise it — `scripts/ci-hygiene.sh` refuses `gh`, a
# `secrets.` reference and a `contents: write` on any workflow without the
# tag-only marker, by design, so no pull-request-triggered job will ever
# reach the upload path. Unproven until the first tag, therefore: that the
# upload succeeds at all, that the asset names on the release object are the
# names `holdfast-<target>.<tar.gz|zip>` that §13.3 composes, and that
# `releases/download/<tag>/<asset>` resolves. The first two surface as a red
# release job. The third is why the draft exists — on the first tag, check
# the asset URLs with an unauthenticated `curl -I` BEFORE promoting, which
# both proves the URL and measures whether §12.3's event has already
# happened.
#
# A second residual, smaller and named rather than papered over: the
# `linux-aarch64` asset is cross-built and no runner here can execute it, so
# it is shape-verified and never run. The other four are executed by the
# rehearsal.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # **§12.1's five assets, one job each.** The names are the spec's platform
  # names and not Rust triples, because §13.3 step 5 has the bootstrap
  # construct `holdfast-<target>.<tar.gz|zip>` from exactly this list — an
  # asset named `holdfast-x86_64-unknown-linux-musl.tar.gz` is an asset the
  # launcher cannot find. Which triple each name maps to, which libc, and how
  # the archive is laid out all live in `scripts/package-release.sh`, so the
  # rehearsal workflow exercises the real answers rather than a copy.
  build:
    # A release that half-happened is worse than one that failed, so `publish`
    # `needs:` this whole matrix. `fail-fast: false` on top of that: when a
    # tag does fail here, the useful output is which of the five targets broke,
    # not the first one to.
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-x86_64
            os: ubuntu-24.04
          - asset: linux-aarch64
            os: ubuntu-24.04
          - asset: macos-aarch64
            os: macos-15
          - asset: macos-x86_64
            os: macos-15-intel
          - asset: windows-x86_64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        shell: bash
        run: rustup show active-toolchain && rustc --version
      # **No build cache here, deliberately**, where the rehearsal has one.
      # §12.4 wants the release built from the tag with `--locked`; a restored
      # cache is a second input to that build which is not in the tag, and the
      # minutes it saves are not worth owning that question on the one
      # workflow whose output people install.
      - name: Build and pack ${{ matrix.asset }}
        shell: bash
        env:
          # Or every shipped binary says `build unknown` in its handshake:
          # `protocol/handshake.rs` reads `option_env!("HOLDFAST_BUILD_SHA")`
          # and its doc comment names the release pipeline as what wires it.
          HOLDFAST_BUILD_SHA: ${{ github.sha }}
        run: ./scripts/package-release.sh "${{ matrix.asset }}" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-${{ matrix.asset }}
          path: dist/
          retention-days: 7
          # `warn` is the default and would give a green job that built
          # nothing, then a release missing an asset nobody noticed.
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # The whole grant, and only here: creating a release writes to the
      # repository. `ci.yml` cannot ask for this — ci-hygiene refuses a write
      # permission on any workflow without the verified marker.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: asset-*
          path: dist
          merge-multiple: true

      # **`SHA256SUMS.txt` is assembled from §12.1's list, not from whatever
      # is in the directory.** A build job that was deleted, renamed or
      # skipped would otherwise produce a four-asset release whose checksum
      # file is internally consistent and silently short — and internally
      # consistent is all the bootstrap can check. The same line runs in the
      # rehearsal.
      - name: Assemble SHA256SUMS.txt over exactly the five §12.1 assets
        run: ./scripts/package-release.sh --sums dist

      # **The consuming half, before publishing rather than after.** §13.3
      # step 5 is the contract this is checked against: the launcher verifies
      # the archive against the fetched `SHA256SUMS.txt` and extracts under
      # safe-archive rules — no absolute paths, no `..`, no symlinks,
      # hardlinks or device files, and exactly the expected `holdfast`
      # executable. An asset that fails any of those is an asset the
      # bootstrap will refuse after download, which is the worst place to
      # find out.
      - name: Every asset verifies and safely extracts
        run: |
          set -euo pipefail
          for a in $(./scripts/package-release.sh --assets); do
            archive="dist/$(./scripts/package-release.sh --archive "$a")"
            echo "=== $archive"
            ./scripts/verify-release-archive.sh dist/SHA256SUMS.txt "$archive"
          done
          ls -l dist
          cat dist/SHA256SUMS.txt

      # **Three things must agree before anything is published**: the tag, the
      # workspace version, and a changelog section that exists. Any pair
      # agreeing while the third does not is the failure this checks for — a
      # tag pushed before the version bump, or a version bumped with no notes
      # written, both of which are easy and both of which produce a release
      # nobody can read.
      - name: The tag, the crate version and the changelog must agree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$version" != "$crate" ]; then
            echo "tag $tag says $version; Cargo.toml says $crate" >&2
            exit 1
          fi
          # **The third check is a script because, inline here, it could not
          # fail.** The extraction and its empty-section guard used to live in
          # this block in this order: extract the section, `printf '\n'`,
          # append ~2.6 KB of link definitions, then `[ ! -s release-notes.md ]`.
          # `-s` is "size greater than zero", and by the time it ran the file
          # could not have a size of zero — the `printf` alone guaranteed a
          # byte. The guard sat three lines below the two lines that made it
          # unreachable and had never once fired, so a `v0.0.8` tag pushed
          # before `## [Unreleased]` was renamed would have published a draft
          # whose entire body was 47 bare link definitions.
          #
          # `scripts/release-notes.sh` is that logic with the check moved in
          # FRONT of the append and widened from "has a byte" to "has a line
          # that is not blank, not a link definition and not a heading". Each
          # of those three was found by trying to get an empty release past
          # the rule: the extractor runs to EOF on the last section, so a
          # trailing empty one swallows the definition block; and `## [X.Y.Z]`
          # opened with Keep a Changelog's `### Added` / `### Fixed` skeleton
          # and never filled in renders as nothing while looking like content.
          # It carries fixtures in both directions and
          # `ci.yml`'s `hygiene` job runs `--self-test` on every pull request,
          # which is what makes this a check whose failure has been
          # demonstrated rather than assumed.
          ./scripts/release-notes.sh "$version" CHANGELOG.md release-notes.md

      # `--verify-tag` so a release cannot be created for a tag that is not on
      # the remote, and `--notes-file` so the body is the changelog verbatim
      # rather than anything this file composed.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # **The name is derived, not composed here.** `CONTRIBUTING.md`
          # settles it as `holdfast X.Y.Z (Codename)`: no `v`, and the
          # codename is the only thing after the number. The tag keeps its
          # `v`; the release name does not. Three releases shipped before
          # this was written and carried three different conventions,
          # because this line was the only thing naming them and it just
          # echoed the ref.
          #
          # `version` is recomputed here rather than carried: each `run:`
          # block is its own shell, and the extractor step's copy is out of
          # scope by the time this runs.
          version="${GITHUB_REF_NAME#v}"
          # The codename comes off the changelog heading, which is the one
          # place it is already recorded beside its version — so there is
          # no second file to update and no way for the two to disagree.
          # Absent (a version cut before the register existed), the name is
          # just `holdfast X.Y.Z`, which is still the convention minus an
          # optional part rather than a different one.
          codename="$(sed -n "s/^## \[$version\][^(]*(\([^)]*\)).*/\1/p" CHANGELOG.md | head -1)"
          if [ -n "$codename" ]; then
            title="holdfast $version ($codename)"
          else
            title="holdfast $version"
          fi
          echo "release title: $title"
          # `--draft` is the §12.3 boundary, not a safety net — see the header.
          # The assets are attached and the release object exists; nothing is
          # reachable at `releases/download/` until a human promotes it, so
          # first external distribution stays an act somebody takes.
          # **The upload list is derived from §12.1, not globbed.** A glob
          # uploads whatever is in the directory, which is the same class of
          # defect as assembling SHA256SUMS.txt from the directory: it cannot
          # tell a missing asset from a directory that never had one.
          upload=(dist/SHA256SUMS.txt)
          for a in $(./scripts/package-release.sh --assets); do
            upload+=("dist/$(./scripts/package-release.sh --archive "$a")")
          done
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --verify-tag \
            --title "$title" \
            --notes-file release-notes.md \
            "${upload[@]}"
          echo
          echo "DRAFT created. Before promoting:"
          echo "  1. curl -I the asset URLs unauthenticated — they must 404 while it is a draft."
          echo "  2. Re-read the §12.3 escapes: crates/holdfast-core/tests/wire_shape.rs"
          echo "     and crates/holdfast-core/src/protocol/method.rs. Promoting ends them."
          echo "  3. gh release edit ${GITHUB_REF_NAME} --draft=false"

  # **crates.io, and it is inert until a token exists.** §12.1 of the design
  # spec lists `cargo install holdfast` as a distribution channel — "published
  # to crates.io as a source-build fallback" — beside the GitHub Release. The
  # names are reserved (`holdfast 0.0.0`, `holdfast-core 0.0.0`, both
  # placeholder crates with no usable code), so the first real upload replaces
  # a stub rather than claiming a name.
  #
  # **A separate job, deliberately.** Publishing to crates.io is irreversible:
  # a version number, once uploaded, can be yanked but never reused or
  # replaced. The GitHub Release above is not — it can be deleted and
  # recreated. So crates.io goes last and behind `needs:`, and a failed
  # release above never leaves a permanent artifact behind it. It also keeps
  # `publish`'s 10-minute budget intact; two verification builds do not fit in
  # it.
  #
  # **The gate is the absence of a secret, not an `if:` on one.** `secrets` is
  # not an available context in `jobs.<id>.if` *or* in a step's `if:`, and
  # actionlint says so for both positions rather than this being a belief:
  # `context "secrets" is not allowed here. available contexts are "github",
  # "inputs", "needs", "vars"`. GitHub does not degrade gracefully either --
  # it refuses the whole run with `Unrecognized named-value: 'secrets'`. So
  # the obvious spelling does not misbehave quietly, it stops the release,
  # and the gate step exists to read the token into `env` -- where the
  # context *is* available -- decide there, and let every later step key off
  # its output.
  #
  # With no `CARGO_REGISTRY_TOKEN` configured this job is one `if`/`else`
  # that writes `publish=false` to `$GITHUB_OUTPUT`, prints two lines and
  # exits 0; every step after it is skipped. That is the intended state
  # until the maintainer decides the version question.
  #
  # **Adding the secret is the decision, and it leaves no diff.** §12.3 makes
  # *first external distribution* the event that binds change discipline, and
  # several escapes in this tree -- the wire-shape record's in-place
  # corrections most of all -- are written on the premise that it has not
  # happened. `cargo install holdfast` is that event as much as a release
  # asset is. It is armed from the repository settings UI with no PR and no
  # review, which is exactly why it is named here.
  crates-io:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: A registry token, or nothing happens
        id: gate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No CARGO_REGISTRY_TOKEN secret is configured." >&2
            echo "The GitHub Release is published; crates.io is skipped." >&2
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.publish == 'true'
        with:
          persist-credentials: false

      # ci.yml's phrasing, and for its reason: `rust-toolchain.toml` is the
      # only pin, so this installs it and prints what it resolved to rather
      # than naming a version here that could disagree with it.
      - name: Install the toolchain rust-toolchain.toml pins
        if: steps.gate.outputs.publish == 'true'
        run: rustup show active-toolchain && rustc --version

      # **The second version string.** `holdfast`'s dependency on
      # `holdfast-core` must carry a literal version — crates.io rejects a
      # path-only dependency — and no `version.workspace` exists inside a
      # dependency spec to inherit it from. A stale literal here fails no
      # build and no test: the workspace still resolves it by path, and only
      # the *published* `holdfast` binds to an older `holdfast-core` already
      # on the index. That is a wrong permanent artifact, so it is checked
      # against the tag here, before anything is uploaded.
      - name: The tag, the workspace version and the dependency literal must agree
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ws="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          dep="$(sed -n 's/^holdfast-core = .*version = "\([^"]*\)".*$/\1/p' Cargo.toml | head -1)"
          if [ -z "$dep" ]; then
            echo "no version literal found on the holdfast-core workspace dependency" >&2
            exit 1
          fi
          if [ "$version" != "$ws" ] || [ "$version" != "$dep" ]; then
            echo "tag $version, workspace $ws, holdfast-core dependency $dep" >&2
            exit 1
          fi
          echo "all three agree on $version"

      # **`--workspace` is what orders this correctly**, and the ordering is
      # not optional: `holdfast` cannot resolve until `holdfast-core` is on
      # the index. Measured on cargo 1.97.1 against the real index, which
      # today holds only the 0.0.0 name reservations:
      #
      #   cargo publish --dry-run -p holdfast-core ... ok
      #   cargo publish --dry-run -p holdfast ....... error: failed to select
      #     a version for the requirement `holdfast-core = "^0.0.7"`;
      #     candidate versions found which didn't match: 0.0.0
      #   cargo publish --dry-run --workspace ....... ok, core uploaded first
      #
      # `--workspace` publishes members in dependency order and, since 1.66,
      # cargo blocks on a just-published version appearing on the index
      # before continuing. **That wait is the one part a dry run cannot
      # exercise** — the dry run aborts before any upload — so it is taken
      # from cargo's documented behaviour rather than measured here. It is
      # still better than the alternative: a hand-rolled two-command script
      # would have to guess at a `sleep`.
      #
      # `--locked` per §12.4: releases build from the committed `Cargo.lock`.
      # No `--no-verify` — the verification build is the check that each
      # tarball compiles from itself, which is the failure mode a path
      # dependency or a missing `include`d file produces and nothing else
      # catches.
      # **There is no resume path, and that is not fixable in this file.**
      # `cargo publish` is not atomic across members: if `holdfast-core`
      # uploads and `holdfast` does not, re-running this job dies on `crate
      # version already uploaded` before it reaches `holdfast`. Recovery is
      # manual -- `cargo publish --locked -p holdfast` from the tagged
      # commit -- and it is written down here because the alternative is
      # working it out while a half-published version is live.
      - name: Publish holdfast-core then holdfast
        if: steps.gate.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked
