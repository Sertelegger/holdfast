# RELEASE-WORKFLOW: tag-triggered publishing
#
# Holdfast's release. **The changelog is the release and this file is the
# messenger** — it publishes the section of CHANGELOG.md that bears the tag's
# version and adds nothing of its own. Release prose is not in the repository,
# is not reviewed with the code, and does not survive the repository being
# recreated; a section under version control is all three.
#
# Constraints this file is held to (enforced by scripts/ci-hygiene.sh):
#   * the `RELEASE-WORKFLOW:` marker above is **verified, not believed**: the
#     `on:` block must name `tags:` and must name none of `branches:`,
#     `pull_request`, `pull_request_target` or `schedule`. That is what makes
#     the publishing capability safe to grant — nothing but somebody tagging
#     a commit on purpose can start this.
#   * no `continue-on-error`, no retry action — a release that half-happened
#     and reported success is worse than one that failed
#   * every `uses:` pinned to a 40-hex commit SHA
#   * `persist-credentials: false`; the token this job needs is passed
#     explicitly to the one step that needs it
#   * `runs-on: ubuntu-24.04`, never ubuntu-latest
#   * explicit timeout-minutes
#
# **`gh` rather than a release action**, deliberately: it is preinstalled on
# the runner, so this adds no third-party dependency to pin, review and watch
# for compromise on the one workflow that holds a write token.
#
# **No binary assets.** §12.3's binding event is *first external
# distribution*, and several deliberate escapes — the wire-shape record's
# in-place corrections most of all — are conditioned on it not having
# happened. Attaching a binary here is that event, and it is not one to
# trigger as a side effect of writing release notes. When it is time, it is a
# decision, and it changes what the escapes above are allowed to do.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The whole grant, and only here: creating a release writes to the
      # repository. `ci.yml` cannot ask for this — ci-hygiene refuses a write
      # permission on any workflow without the verified marker.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # **Three things must agree before anything is published**: the tag, the
      # workspace version, and a changelog section that exists. Any pair
      # agreeing while the third does not is the failure this checks for — a
      # tag pushed before the version bump, or a version bumped with no notes
      # written, both of which are easy and both of which produce a release
      # nobody can read.
      - name: The tag, the crate version and the changelog must agree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$version" != "$crate" ]; then
            echo "tag $tag says $version; Cargo.toml says $crate" >&2
            exit 1
          fi
          # The section for exactly this version, up to the next heading.
          awk -v v="## [$version]" '
            index($0, v) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          # **The definitions, or every `[#45]` renders as literal text.**
          # Reference-style links are defined once at the foot of the file,
          # after every version section, so the extractor above cannot reach
          # them — it stops at the next `## `. A body carrying `[#45]` with
          # no matching definition shows the brackets, which is precisely the
          # defect the changelog rewrite existed to fix, reintroduced one
          # surface over. Appending every definition is safe: Markdown
          # ignores ones nothing references.
          printf '\n' >> release-notes.md
          grep -E '^\[[^]]+\]: https?://' CHANGELOG.md >> release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no '## [$version]' section with content." >&2
            echo "Cutting a release is: rename [Unreleased] to the version with" >&2
            echo "its date, commit, then tag. The notes are the section." >&2
            exit 1
          fi
          echo "notes: $(wc -l < release-notes.md) lines"

      # `--verify-tag` so a release cannot be created for a tag that is not on
      # the remote, and `--notes-file` so the body is the changelog verbatim
      # rather than anything this file composed.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # **The name is derived, not composed here.** `CONTRIBUTING.md`
          # settles it as `holdfast X.Y.Z (Codename)`: no `v`, and the
          # codename is the only thing after the number. The tag keeps its
          # `v`; the release name does not. Three releases shipped before
          # this was written and carried three different conventions,
          # because this line was the only thing naming them and it just
          # echoed the ref.
          #
          # `version` is recomputed here rather than carried: each `run:`
          # block is its own shell, and the extractor step's copy is out of
          # scope by the time this runs.
          version="${GITHUB_REF_NAME#v}"
          # The codename comes off the changelog heading, which is the one
          # place it is already recorded beside its version — so there is
          # no second file to update and no way for the two to disagree.
          # Absent (a version cut before the register existed), the name is
          # just `holdfast X.Y.Z`, which is still the convention minus an
          # optional part rather than a different one.
          codename="$(sed -n "s/^## \[$version\][^(]*(\([^)]*\)).*/\1/p" CHANGELOG.md | head -1)"
          if [ -n "$codename" ]; then
            title="holdfast $version ($codename)"
          else
            title="holdfast $version"
          fi
          echo "release title: $title"
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "$title" \
            --notes-file release-notes.md

  # **crates.io, and it is inert until a token exists.** §12.1 of the design
  # spec lists `cargo install holdfast` as a distribution channel — "published
  # to crates.io as a source-build fallback" — beside the GitHub Release. The
  # names are reserved (`holdfast 0.0.0`, `holdfast-core 0.0.0`, both
  # placeholder crates with no usable code), so the first real upload replaces
  # a stub rather than claiming a name.
  #
  # **A separate job, deliberately.** Publishing to crates.io is irreversible:
  # a version number, once uploaded, can be yanked but never reused or
  # replaced. The GitHub Release above is not — it can be deleted and
  # recreated. So crates.io goes last and behind `needs:`, and a failed
  # release above never leaves a permanent artifact behind it. It also keeps
  # `publish`'s 10-minute budget intact; two verification builds do not fit in
  # it.
  #
  # **The gate is the absence of a secret, not an `if:` on one.** `secrets` is
  # not an available context in `jobs.<id>.if` *or* in a step's `if:`, and
  # actionlint says so for both positions rather than this being a belief:
  # `context "secrets" is not allowed here. available contexts are "github",
  # "inputs", "needs", "vars"`. Written that way the expression is empty, and
  # a job gated on an empty string runs unconditionally. So the first step
  # reads the token into `env` — where the context *is* available — decides
  # there, and every later step keys off its output. With no `CARGO_REGISTRY_TOKEN` configured this job is one shell
  # command that prints a line and exits, which is the intended state until
  # the maintainer decides the version question.
  crates-io:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: A registry token, or nothing happens
        id: gate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No CARGO_REGISTRY_TOKEN secret is configured." >&2
            echo "The GitHub Release is published; crates.io is skipped." >&2
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.publish == 'true'
        with:
          persist-credentials: false

      # ci.yml's phrasing, and for its reason: `rust-toolchain.toml` is the
      # only pin, so this installs it and prints what it resolved to rather
      # than naming a version here that could disagree with it.
      - name: Install the toolchain rust-toolchain.toml pins
        if: steps.gate.outputs.publish == 'true'
        run: rustup show active-toolchain && rustc --version

      # **The second version string.** `holdfast`'s dependency on
      # `holdfast-core` must carry a literal version — crates.io rejects a
      # path-only dependency — and no `version.workspace` exists inside a
      # dependency spec to inherit it from. A stale literal here fails no
      # build and no test: the workspace still resolves it by path, and only
      # the *published* `holdfast` binds to an older `holdfast-core` already
      # on the index. That is a wrong permanent artifact, so it is checked
      # against the tag here, before anything is uploaded.
      - name: The tag, the workspace version and the dependency literal must agree
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ws="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          dep="$(sed -n 's/^holdfast-core = .*version = "\([^"]*\)".*$/\1/p' Cargo.toml | head -1)"
          if [ -z "$dep" ]; then
            echo "no version literal found on the holdfast-core workspace dependency" >&2
            exit 1
          fi
          if [ "$version" != "$ws" ] || [ "$version" != "$dep" ]; then
            echo "tag $version, workspace $ws, holdfast-core dependency $dep" >&2
            exit 1
          fi
          echo "all three agree on $version"

      # **`--workspace` is what orders this correctly**, and the ordering is
      # not optional: `holdfast` cannot resolve until `holdfast-core` is on
      # the index. Measured on cargo 1.97.1 against the real index, which
      # today holds only the 0.0.0 name reservations:
      #
      #   cargo publish --dry-run -p holdfast-core ... ok
      #   cargo publish --dry-run -p holdfast ....... error: failed to select
      #     a version for the requirement `holdfast-core = "^0.0.7"`;
      #     candidate versions found which didn't match: 0.0.0
      #   cargo publish --dry-run --workspace ....... ok, core uploaded first
      #
      # `--workspace` publishes members in dependency order and, since 1.66,
      # cargo blocks on a just-published version appearing on the index
      # before continuing. **That wait is the one part a dry run cannot
      # exercise** — the dry run aborts before any upload — so it is taken
      # from cargo's documented behaviour rather than measured here. It is
      # still better than the alternative: a hand-rolled two-command script
      # would have to guess at a `sleep`.
      #
      # `--locked` per §12.4: releases build from the committed `Cargo.lock`.
      # No `--no-verify` — the verification build is the check that each
      # tarball compiles from itself, which is the failure mode a path
      # dependency or a missing `include`d file produces and nothing else
      # catches.
      - name: Publish holdfast-core then holdfast
        if: steps.gate.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked
