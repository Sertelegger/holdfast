# Holdfast CI — push and pull-request pipeline.
# Plan: docs/superpowers/plans/2026-08-12-holdfast-ci-and-verification-harness.md
#
# Constraints this file is held to (enforced by scripts/ci-hygiene.sh):
#   * no secrets, no publishing, no deploy — no release action, no
#     `secrets.` reference, no cargo publish, no docker push, no git push
#   * no `continue-on-error` and no retry action anywhere — a retried PTY
#     test hides the race it exists to catch, and this project has shipped
#     two such races
#   * every `uses:` pinned to a 40-hex commit SHA, version in the comment
#   * `persist-credentials: false` on every checkout — the default is true
#     and writes a pushable token into .git/config
#   * `runs-on: ubuntu-24.04`, never ubuntu-latest
#   * explicit timeout-minutes on every job — the default is 360
#   * every job body is a command a developer can run locally
#
# Pinned inputs:
#   runner image    ubuntu-24.04
#   rust toolchain  channel "1.97" — from rust-toolchain.toml, the ONLY pin.
#                   Do not add RUSTUP_TOOLCHAIN and do not add a toolchain
#                   action; either creates a second pin that can drift.
#   cross target    x86_64-pc-windows-gnu
#   actions/checkout            v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   Swatinem/rust-cache         v2.9.2  6323deb102c322ba6fcbdcafc7e3dddab59af2b6
#   actions/upload-artifact     v7.0.1  043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/setup-python        v7.0.0  5fda3b95a4ea91299a34e894583c3862153e4b97
#   python                      3.13    (minor series; see the probe job)

name: CI

on:
  # `paths-ignore` is REPEATED under both triggers rather than shared: the
  # workflow parser does not support YAML anchors, and a workflow that
  # fails to parse is a repository with no CI at all.
  #
  # **Checked before adding, because the usual trap is a permanent
  # pending.** `paths-ignore` makes a skipped job report nothing rather
  # than success, so a required status check on it leaves every docs-only
  # PR pending forever. This repository has no branch protection at all —
  # the API answers 403, "upgrade to GitHub Pro or make this repository
  # public" — so there are no required checks to strand. **Re-check this
  # the day the repository goes public or gains protection.**
  #
  # `**.md` is the spelling GitHub's own cheat sheet uses for "every
  # Markdown file in the repository". **It is not a fix for `**/*.md`,
  # which this rule used first and which was never broken** — `**`
  # matches any character including `/`, so `**/` collapses to zero path
  # segments and the old glob already matched `README.md` and the other
  # seven root files. The commit that changed it argued otherwise from
  # the true observation that 8 of 9 tracked `.md` files sit at the root,
  # and the inference was one step too wide. Kept because it is the
  # documented spelling, recorded because the reasoning was wrong and a
  # wrong reason outlives the line it justified.
  #
  # Nothing in CI reads these paths: `ci-hygiene.sh` does not police
  # markdown, and the only `*.md` glob in `scripts/` is
  # `artifact-deletion-check.py` scanning the git-ignored `plans/` tree,
  # which is absent from a CI checkout.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

permissions:
  contents: read

# Supersede an in-flight run for the same ref. Scheduled workflows live in
# their own files and therefore their own concurrency groups, so a push can
# never cancel a nightly flake hunt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are useless across jobs and bloat the cache.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Pinned rather than tracking nproc. The standard runner is 2 vCPU while
  # this repo is private and 4 vCPU after it goes public; a fixed value
  # means that flip does not silently change the timing profile the suite
  # was calibrated under. See plan Task 4 Step 1.
  TEST_THREADS: "4"

jobs:
  # --- checks that need no capability gate ---------------------------------
  # hygiene/fmt/clippy/windows-cross deliberately do NOT `needs: probe`.
  # None of them spawns a shell or allocates a pty, so the probe's
  # assertions are irrelevant to them, and gating them would add minutes to
  # the feedback a developer actually reads first. Only `test` is gated,
  # because only `test` is the job whose green the probe makes meaningful.

  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/ci-hygiene.sh

  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup show active-toolchain && rustc --version
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup show active-toolchain && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # -D warnings is what makes clippy::await_holding_lock a hard error
      # (REQ-C-004). That lint is warn-by-default in clippy 0.1.97 —
      # verified 2026-08-12 against a probe crate — so no extra
      # configuration is needed and none should be added.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  windows-cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup show active-toolchain && rustc --version
      - run: rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-cross
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --all-targets, and clippy rather than check: measured clean at
      # 866e10c on 2026-08-12 with a forced rebuild. An earlier revision of
      # the plan scoped this to lib+bin because four errors lived in
      # tests/integration.rs; those are fixed, and the narrower form must
      # not be restored without re-measuring.
      #
      # This proves Holdfast still COMPILES for Windows. It is not evidence
      # that it WORKS on Windows — that needs a Windows runner, which is
      # milestone 0.0.11.
      - run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-gnu -- -D warnings

  # --- the capability gate -------------------------------------------------

  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Shells the test suite spawns BY NAME.
      #
      # MEASURED on image ubuntu24 20260720.247.2, run 31737949604, before
      # anything was installed: zsh NOT PREINSTALLED, fish NOT PREINSTALLED;
      # bash, sh, dash, python3 (3.12.3), jq (1.7), tmux and — contrary to
      # the image manifest, which does not list it — less (590) all present.
      # `less` stays in this line anyway: it gates the only PTY-level test of
      # REQ-PD-011/015, and a program the manifest does not promise is a
      # program that can leave without notice. `jq` is asserted by the probe
      # rather than installed. `fish` is NOT installed, by measurement — see
      # the `test` job below.
      - name: Install the shells and helpers the test suite spawns by name
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zsh dash less python3
      # The one requirement of tests/detection.rs that is a VERSION claim
      # rather than a presence one (`Need::PyreplPython`):
      # matrix_row_the_python_repl_is_at_prompt_with_no_repl_specific_config
      # needs a REPL that drives bracketed paste with no configuration.
      # PyREPL landed in CPython 3.13 and enables it itself; the image's own
      # python3 is 3.12.3, whose readline REPL emits none — measured on
      # three runner VMs — and the row then reaches §8.3's echo rung and
      # answers `AwaitingSecret` at 0.95 for an ordinary `>>> ` prompt.
      #
      # "3.13" and not a patch: the requirement is `>= 3.13`, the runner
      # image's tool cache already carries a 3.13.x so this resolves to a
      # cache hit rather than a download, and pinning the patch would turn
      # every tool-cache refresh into one.
      #
      # This step matters only because it PREPENDS its interpreter to PATH:
      # the row scans PATH for `python3` and `python3.<minor>` and asks each
      # one its own version, so an interpreter installed somewhere the scan
      # does not reach would buy nothing. ci-probe.sh prints every
      # interpreter it found and FAILS when none is >= 3.13, which is how
      # that stays true rather than assumed.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup show active-toolchain && rustc --version
      - run: ./scripts/ci-probe.sh

  # --- the suite -----------------------------------------------------------

  test:
    needs: probe
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # HOLDFAST_REQUIRE_ALL_SHELLS: "1" is STILL not set, and as of 2026-08-13
    # that is a measurement rather than a staging decision. The variable
    # makes tests/detection.rs's `have()` guard PANIC instead of skip and
    # tightens its row census to zero skips, so it can only be set once
    # every gated row can actually run. Two rows skipped when this pipeline
    # first went green. One is fixed here; the other is not CI's to fix.
    #
    #   * The PyREPL row skipped because ubuntu-24.04 ships CPython 3.12.3.
    #     `actions/setup-python` below puts a 3.13 on PATH, the row runs,
    #     and ci-probe.sh turns the build red if it ever stops being there.
    #
    #   * The fish row skipped because fish is not installed — and
    #     INSTALLING IT DOES NOT MAKE IT PASS. Measured 2026-08-13 in
    #     containers on this exact base image, at both fish versions
    #     obtainable on it:
    #
    #     fish 3.7.0, noble's own archive. The snippet installs and marks
    #     correctly — `functions -c fish_prompt __holdfast_orig_fish_prompt`,
    #     the open question the row was written for, WORKS on a built-in
    #     default prompt — and the row still fails, on its last command.
    #     `(exit 42)` is a subshell in bash and zsh and a command
    #     SUBSTITUTION in fish, which rejects it outright ("command
    #     substitutions not allowed here"), so nothing runs and the stream
    #     ends `… A B A B` where the shared expectation wants
    #     `… C D;42 A B`. The bash-ism is in the assertion helper all three
    #     shells share, in crates/, and belongs to whoever owns detection.
    #
    #     fish 4.8.1, the fish maintainers' PPA — the only route to a
    #     fish >= 4 on this image. Zero markers in 20 s: Holdfast's own
    #     snippet guard declines to inject. It probes `status test-feature
    #     no-mark-prompt`, but the feature is NAMED `mark-prompt`
    #     (`no-mark-prompt` is the spelling that disables it), so the probe
    #     answers 2 = unrecognised on every fish and the guard collapses to
    #     "decline on any fish >= 4". Also measured there: fish >= 4.1
    #     queries the terminal at startup and waits 10 s for a Primary
    #     Device Attribute reply that a bare PTY never sends.
    #
    # THE SHORTFALL IS TWO ROWS IN TWO BINARIES. This comment said "exactly
    # one row of the 21 in tests/detection.rs" until 2026-08-19 and that was
    # measurably false: REQ-TS-008's row in
    # crates/holdfast-core/tests/screen.rs skips on a fish-less host too,
    # for its own reason, and NEITHER measurement above touches it. It never
    # runs `(exit 42)` — that bash-ism is in detection.rs's shared assertion
    # helper — and it sets `shell_integration: None` and injects no snippet,
    # so the marker collision cannot reach it either. The census could not
    # see the second row because all three skip lines began with the same
    # words and one match satisfied the one agreed prefix.
    #
    # Both are ASSERTED rather than tolerated: scripts/ci-skip-census.sh now
    # carries one record per ROW, keyed on the libtest row name, and fails
    # on any skip other than those two, on either of them ceasing to happen,
    # and on either ROW going missing from the log.
    #
    # Setting the variable today would paint this job red for a defect that
    # is not the pipeline's; installing fish would do the same; dropping
    # fish from the picture would restore the silent green that this whole
    # change exists to end. The variable would ALSO not reach REQ-TS-008 if
    # it were set — it is read only by tests/detection.rs's `have()`, and
    # tests/screen.rs is a separate binary — which is review finding I7(a)
    # and a change to that test file rather than to this one.
    #
    # WHAT THAT ROW NEEDED WAS ITS OWN FISH, and it now has one: the
    # `fish-req-ts-008` job below installs fish 4.8.1 and measures it.
    #
    # WHEN DETECTION.RS'S FISH ROW CAN PASS, five things move in ONE change:
    # `fish` into the apt line here and in the probe job, the variable set
    # here and in nightly.yml, and BOTH records deleted from
    # ci-skip-census.sh.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the shells and helpers the test suite spawns by name
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zsh dash less python3
      # `Need::PyreplPython` — see the probe job for why this is a version
      # claim and not a presence one. The row asks each `python3` and
      # `python3.<minor>` on PATH for its own version, so what makes this
      # step count is that it prepends its interpreter to PATH.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup show active-toolchain && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The census's own gates, deleted one at a time against fixtures with
      # known answers. It reads no log, needs no build and takes under a
      # second, and it runs BEFORE the suite so a census that can no longer
      # fail is found in seconds rather than after the forty-minute job it
      # is supposed to be guarding.
      - name: Prove the skip census can still fail
        run: ./scripts/ci-skip-census.sh --self-test
      # --no-fail-fast is not optional. Measured on this project: without it
      # a lib-test failure hides whether the integration suite catches the
      # same defect, which is the only way to tell a narrow defect from a
      # broad one.
      #
      # --show-output prints the captured stdout/stderr of *passing* tests,
      # so a `skipping: …` notice — and a `not-asserted: …` one, from an
      # assertion gated off inside a row that RAN — is visible in the log
      # instead of swallowed by libtest. It is also what the census step
      # below reads, which is why the log is teed rather than only printed.
      #
      # `set -o pipefail` is not decoration: the default shell for `run:`
      # is `bash -e {0}` WITHOUT pipefail, so a failing `cargo test` piped
      # into `tee` would exit 0 and this job would go green on a red suite.
      - name: Run the suite, keeping the log for the skip census
        run: |
          set -o pipefail
          cargo test --workspace --locked --no-fail-fast -- --test-threads=${{ env.TEST_THREADS }} --show-output 2>&1 | tee test-output.log
      # The census the variable would have enforced from inside the suite.
      # It fails on any skip this pipeline has not agreed to, and on an
      # agreed one that stopped happening — and, since it grew a second
      # marker, on any ASSERTION gated off inside a row that ran without an
      # agreed entry, and on an agreed entry whose assertion turns out to
      # have run. The one entry today is §11.4's control-path p99, which
      # this 2-core runner cannot make a statement about; it goes red here
      # the day the runner is big enough, which is the only notice anyone
      # will get.
      - run: ./scripts/ci-skip-census.sh test-output.log

  # --- the one row the fish-less suite cannot measure ----------------------

  fish-req-ts-008:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # §4.5.1's decision to write unsolicited bytes into a child's stdin rests
    # on this row's three-arm measurement, and until now that measurement had
    # executed NOWHERE in this repository's automation — the only evidence
    # was two container trials recorded in a prose comment. The `test` job
    # cannot host it: installing fish there takes detection.rs's fish row
    # red, for a defect that is not the pipeline's. So the row gets its own
    # job and its own fish, and the `detection` binary is never invoked here,
    # which leaves that expected failure exactly where it was.
    #
    # THE PPA IS NOT A CONVENIENCE. Measured 2026-08-19 by running this row's
    # own test binary in containers, at all three fish versions obtainable:
    #
    #   fish 4.8.1 (this PPA)  — the row RUNS and PASSES. Silent arm 10.02 s,
    #     all-but-DA1 10.07 s with all four probes answered, DA1 0.054 s,
    #     against assertions of >= 5 s / >= 5 s / < 1 s. This is the fish the
    #     row was calibrated on.
    #   fish 4.2.1 (Ubuntu 26.04's archive) — the row RUNS and FAILS, twice
    #     over: 4.2.1 emits no OSC 11 background query at all, so the middle
    #     arm answers three probes of four and its `assert_eq!` fails, and
    #     its silent arm reaches a prompt in 2.01 s rather than the >= 5 s
    #     the row asserts. 4.2.1 does not do 4.1's ten-second DA1 wait.
    #   fish 3.7.0 (noble's own archive) — the row's second arm SKIPS it.
    #
    # So "install any fish >= 4" is not the requirement and would be a red
    # job; noble's own fish is not the requirement and would be a silent
    # skip. `ppa:fish-shell/release-4` is the only route to a fish this row
    # can measure on ubuntu-24.04, and it was verified on that exact base
    # image: `apt-cache policy fish` reports 4.8.1-1~noble after the add.
    #
    # Not gated on `probe`: the probe asserts the presence of the shells the
    # main suite spawns by name, and fish is deliberately not among them —
    # this job installs its own. Gating would add the probe's minutes to a
    # job that needs none of its assertions.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install fish 4.x from the fish-shell maintainers' PPA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:fish-shell/release-4
          sudo apt-get install -y -qq --no-install-recommends fish
          fish --version
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup show active-toolchain && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fish-req-ts-008
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `--show-output` is load-bearing twice over, not decoration copied
      # from the `test` job. The row announces what it measured with
      # `eprintln!`, and libtest captures that for a PASSING test; without
      # the flag the log below contains neither the `skipping: ` notice nor
      # the `REQ-TS-008 measured against ` line, and the "did it skip?" check
      # would be reading a file that cannot contain the answer either way.
      #
      # `set -o pipefail`: the default shell for `run:` is `bash -e {0}`
      # WITHOUT it, so a failing `cargo test` piped into `tee` exits 0.
      - name: Measure REQ-TS-008 against a real fish
        run: |
          set -o pipefail
          cargo test -p holdfast-core --locked --test screen -- \
            --exact only_answering_da1_takes_fish_to_its_first_prompt \
            --show-output 2>&1 | tee fish-req-ts-008.log
      # A step that installs fish and a row that still skips is the same
      # defect one layer up, and it is the one this job exists to end: a
      # SKIPPED row reports `ok` and `1 passed; 0 failed`, so the step above
      # is green either way. Three checks, each catching what the others
      # cannot:
      #
      #   1. exactly one row ran — catches the row RENAMED or DELETED, where
      #      the filter matches nothing and libtest reports `0 passed` with
      #      everything filtered out, cheerfully, at exit 0.
      #   2. no `skipping: ` notice — catches the fish install silently
      #      resolving to noble's 3.7.0, which the row's second arm skips.
      #   3. the row's own `REQ-TS-008 measured against ` line IS present —
      #      the anti-vacuity check that makes 2 mean something. Without it,
      #      a log whose `--show-output` was dropped contains no `skipping: `
      #      line for the reason that it contains no captured output at all,
      #      and check 2 passes on a run that proves nothing.
      - name: The row must have RUN — a skipped row is a pass that is not one
        run: |
          if ! grep -qE '^test result: ok\. 1 passed; 0 failed;' fish-req-ts-008.log; then
            echo "REQ-TS-008 did not report exactly one passing row. The row was" >&2
            echo "renamed, deleted, or filtered out — this job measured nothing." >&2
            grep -E '^test result:' fish-req-ts-008.log >&2 || true
            exit 1
          fi
          if grep -q '^skipping: ' fish-req-ts-008.log; then
            echo "REQ-TS-008 SKIPPED on a runner that installed fish for it:" >&2
            grep '^skipping: ' fish-req-ts-008.log >&2
            fish --version >&2 || true
            exit 1
          fi
          if ! grep -q '^REQ-TS-008 measured against ' fish-req-ts-008.log; then
            echo "The row reported no 'REQ-TS-008 measured against …' line, so this" >&2
            echo "log cannot show whether it skipped. Was --show-output dropped?" >&2
            exit 1
          fi
          grep -E '^REQ-TS-008 ' fish-req-ts-008.log

  # --- the artifact --------------------------------------------------------

  package:
    # `needs: test` is the whole point: no artifact exists for a tree that
    # did not pass. The build that gets installed is the build that was
    # tested.
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup show active-toolchain && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked --workspace
      # The same smoke script, against the binary that will actually be
      # installed. `jq` is preinstalled on ubuntu-24.04 (1.7.1).
      - run: ./scripts/mcp-smoke.sh ./target/release/holdfast
      # And the negative control, which is what makes the run above mean
      # something. CONTRIBUTING.md has claimed since 0.0.1 that every
      # counted check fails against a binary that does nothing, and
      # nothing ever ran it: 0.0.6 shipped four checks that stayed green
      # against `/bin/true` and all four gates were still green, because
      # "a check you can run" is not a check.
      #
      # Inverted on purpose -- here a PASSING smoke run is the failure --
      # and `F == N` rather than a literal, so adding a check cannot make
      # this step stale. Needs no build: `/bin/true` is the binary.
      - name: mcp-smoke negative control (every counted check must fail)
        run: |
          if ./scripts/mcp-smoke.sh /bin/true > negative-control.txt 2>&1; then
            echo "the negative control PASSED: some counted check does not depend on the server" >&2
            cat negative-control.txt >&2
            exit 1
          fi
          line="$(grep '^SMOKE FAILED:' negative-control.txt || true)"
          f="$(printf '%s\n' "$line" | sed -n 's/^SMOKE FAILED: \([0-9]*\) of [0-9]* .*/\1/p')"
          n="$(printf '%s\n' "$line" | sed -n 's/^SMOKE FAILED: [0-9]* of \([0-9]*\) .*/\1/p')"
          if [ -z "$f" ] || [ "$f" != "$n" ]; then
            echo "expected every counted check to fail against /bin/true, got: ${line:-<no SMOKE FAILED line>}" >&2
            grep '^  ok ' negative-control.txt >&2 || true
            exit 1
          fi
          echo "negative control: $f of $n checks failed, as required"
          rm -f negative-control.txt
      - run: sha256sum target/release/holdfast | tee holdfast-linux-x86_64.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: holdfast-linux-x86_64-${{ github.sha }}
          path: |
            target/release/holdfast
            holdfast-linux-x86_64.sha256
          retention-days: 30
          # The default is `warn`, which produces a GREEN job with a warning
          # nobody reads when the binary is missing. That is a job that
          # cannot fail. `error` is mandatory here.
          if-no-files-found: error
