# Holdfast CI — push and pull-request pipeline.
# Plan: docs/superpowers/plans/2026-08-12-holdfast-ci-and-verification-harness.md
#
# Constraints this file is held to (enforced by scripts/ci-hygiene.sh):
#   * **publishing is gated on the trigger, not banned.** A workflow that
#     opts in with a `RELEASE-WORKFLOW:` marker may use secrets, release
#     actions, `gh`, `cargo publish` and `git push` — but only if its `on:`
#     block names `tags:` and names none of `branches:`, `pull_request`,
#     `pull_request_target` or `schedule`. The marker is verified, not
#     believed. Everywhere else those capabilities stay forbidden, so *this*
#     file cannot authenticate to anything no matter what it grows
#   * no `continue-on-error` and no retry action anywhere — a retried PTY
#     test hides the race it exists to catch, and this project has shipped
#     two such races
#   * every `uses:` pinned to a 40-hex commit SHA, version in the comment
#   * `persist-credentials: false` on every checkout — the default is true
#     and writes a pushable token into .git/config
#   * a PINNED runner image, never a `-latest` alias. `ubuntu-24.04`
#     everywhere except `windows-native`, which is `windows-2022`
#   * explicit timeout-minutes on every job — the default is 360
#   * every job body is a command a developer can run locally
#
# Pinned inputs:
#   runner images   ubuntu-24.04, and windows-2022 for `windows-native`
#   rust toolchain  channel "1.97" — from rust-toolchain.toml, the ONLY pin.
#                   Do not add RUSTUP_TOOLCHAIN and do not add a toolchain
#                   action; either creates a second pin that can drift.
#   cross target    x86_64-pc-windows-gnu
#   actions/checkout            v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   Swatinem/rust-cache         v2.9.2  6323deb102c322ba6fcbdcafc7e3dddab59af2b6
#   actions/upload-artifact     v7.0.1  043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/setup-python        v7.0.0  5fda3b95a4ea91299a34e894583c3862153e4b97
#   python                      3.13    (minor series; see the probe job)
#   actionlint                  1.7.12  (verified against its checksums.txt)
#   cargo-nextest               0.9.143 (no published checksums file; pinned
#                                       by the sha256 of the tarball that was
#                                       fetched, recorded in the `test` job)

name: CI

on:
  # **There is no `paths-ignore` here, and its absence is the decision.**
  # A workflow filtered out at the `on:` level does not report a skipped
  # conclusion — it reports nothing at all — so a required status check on
  # any job below would leave every docs-only PR pending forever, with no
  # way to merge and nothing red to explain it.
  #
  # That was survivable for exactly as long as nothing could be required.
  # The filter's own comment said so, and said what would end it: *"the API
  # answers 403, upgrade to GitHub Pro or make this repository public — so
  # there are no required checks to strand. Re-check this the day the
  # repository goes public or gains protection."* The repository went public
  # on **2026-09-02** — the repo object's own `created_at`, which IS the
  # going-public event because the repository was deleted and recreated that
  # day; the `v0.0.7` tag dated 2026-09-01 predates the object holding it.
  # This is that re-check, and the filter loses.
  #
  # **Deleted rather than reworked into job-level `if:` conditions**, which
  # would keep the saving and still post a check run for every job. That form
  # rests on GitHub scoring an `if:`-skipped job as a satisfied required
  # check — documented behaviour, but a property this repository cannot
  # assert about itself, and the whole point of the change is to stop
  # depending on an unverified claim about what a missing check does.
  # Standard runners are free on public repositories, so the filter now buys
  # nothing and risks a deadlock.
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supersede an in-flight run for the same ref. Scheduled workflows live in
# their own files and therefore their own concurrency groups, so a push can
# never cancel a nightly flake hunt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are useless across jobs and bloat the cache.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Pinned rather than tracking nproc. The standard runner was 2 vCPU while
  # this repository was private and is 4 vCPU now that it is public
  # (2026-09-02); a fixed value is why that flip did not silently change the
  # timing profile the suite was calibrated under. See plan Task 4 Step 1.
  # The calibration still describes a 2-vCPU box, deliberately — re-taking it
  # on 4 is a measurement, not an edit.
  #
  # KEPT, and mapped to nextest's `-j`, rather than dropped when the `test`
  # job stopped using `cargo test`. Two reasons, both of which would have
  # been lost by deleting it:
  #   * nextest's DEFAULT is one test process per core. That is exactly the
  #     nproc-tracking this pin exists to refuse — it would hand the runner's
  #     core count back the power to change the suite's timing profile with
  #     no diff anywhere.
  #   * `scripts/ci-flake-hunt.sh` refuses to run at or below "the CI test
  #     job's parallelism", reading this variable's value to decide. A test
  #     job with no stated parallelism makes that assertion meaningless.
  # The unit changed and the ceiling did not: libtest's `--test-threads` was
  # threads inside one binary at a time, nextest's `-j` is concurrent test
  # PROCESSES across the whole workspace. Four either way.
  TEST_THREADS: "4"

jobs:
  # --- checks that need no capability gate ---------------------------------
  # hygiene/actionlint/fmt/clippy/windows-cross deliberately do NOT
  # `needs: probe`.
  # None of them spawns a shell or allocates a pty, so the probe's
  # assertions are irrelevant to them, and gating them would add minutes to
  # the feedback a developer actually reads first. Only `test` is gated,
  # because only `test` is the job whose green the probe makes meaningful.

  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # **The self-test first**, and it is not ceremony: this script's own
      # fixtures silently stopped passing when a later rule was added, and
      # nothing noticed because CI ran the script and never its self-test. A
      # guard whose guard is unrun is a guard on trust.
      - run: ./scripts/ci-hygiene.sh --self-test
      - run: ./scripts/ci-hygiene.sh

  # `dev/workflows/verify.md` has listed `actionlint` under *"CI's own gate,
  # which must pass"* since the file was written, and CI did not run it —
  # so the sentence was false, and the tool was not installed on the machine
  # of anyone who tried to follow it either. A named step nobody executes is
  # worth what no step is worth.
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # **Asserted, not assumed.** actionlint shells out to shellcheck to
      # lint the shell inside every `run:` block, and when it is missing it
      # skips that silently and still exits 0 — so the check most likely to
      # find a real defect in this file is the one that would quietly not
      # run. `ubuntu-24.04` ships shellcheck; this step is what makes that a
      # thing CI has verified rather than a thing the image notes promise.
      - name: shellcheck must exist, or actionlint's best check is a no-op
        run: shellcheck --version
      - name: Install actionlint, verified against its published checksums
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSLO "${base}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz$" \
            "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
      # The glob is the same one `verify.md` step 5 names, so a developer
      # running that file locally runs this job.
      - run: ./actionlint .github/workflows/*.yml

  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup show active-toolchain && rustc --version
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup show active-toolchain && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # -D warnings is what makes clippy::await_holding_lock a hard error
      # (REQ-C-004). That lint is warn-by-default in clippy 0.1.97 —
      # verified 2026-08-12 against a probe crate — so no extra
      # configuration is needed and none should be added.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  windows-cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup show active-toolchain && rustc --version
      - run: rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-cross
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --all-targets, and clippy rather than check: measured clean at
      # 866e10c on 2026-08-12 with a forced rebuild. An earlier revision of
      # the plan scoped this to lib+bin because four errors lived in
      # tests/integration.rs; those are fixed, and the narrower form must
      # not be restored without re-measuring.
      #
      # This proves Holdfast still COMPILES for Windows, against the GNU ABI,
      # on a cheap Linux runner in about two minutes. It is not evidence that
      # it WORKS there — `windows-native` below is. Both are kept: this one
      # fails fast and catches a `#[cfg]` split on every PR, and the shipped
      # target is MSVC, which this does not check.
      - run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-gnu -- -D warnings

  # --- the Windows runner --------------------------------------------------

  windows-native:
    runs-on: windows-2022
    timeout-minutes: 40
    # **The first job in this repository that executes Holdfast's own code on
    # Windows.** Until it existed, the entire Windows position rested on a
    # cross-compile: `windows-cross` proves the crate type-checks for
    # `x86_64-pc-windows-gnu` and nothing more, and the `#[cfg(windows)]` arms
    # added in #19 were verified by the compiler and by no test anywhere.
    #
    # **What those arms are, counted rather than estimated.** Eight CLI arms:
    # seven refusals (`daemon run`, `daemon start`, `daemon status`, `list`,
    # `logs`, `attach`, `watch`) and `daemon stop`, which is NOT a refusal —
    # §3.2 makes it idempotent, so it prints "no daemon running" and exits 0.
    # Plus the inherited-ACL warning and the config trust arm. (This comment
    # said "six CLI refusals" through three revisions; five went through the
    # shared helper, `attach`/`watch` had hand-rolled copies, and `daemon stop`
    # was miscounted as a refusal after the commit that stopped it being one.)
    #
    # `windows-2022` and not `windows-latest`: `ci-hygiene.sh` rejects the
    # alias, and its self-test carries a case asserting a pinned `windows-2022`
    # is accepted, written for exactly this job.
    #
    # **MSVC, not GNU.** The host toolchain here is
    # `x86_64-pc-windows-msvc`, which is what a Windows user actually installs
    # and what a release binary would be. `windows-cross` checks the other ABI;
    # neither subsumes the other.
    #
    # **WHY THIS IS NOT `cargo test --workspace`.** Six of `holdfast-core`'s
    # integration targets are ungated; four of them — `detection`,
    # `integration`, `screen`, `schema` — spawn a shell by NAME, 26/33/8/13
    # references respectively (`bash`, `zsh`, `dash`, `fish`, and one `sh` in
    # `schema`). **`fish` is in those totals and was missing from this list**,
    # which is why re-deriving them without it gives 21/33/5/11 and looks like
    # a drift. The other two ungated targets, `source_guards` and
    # `stress_write_path`, spawn nothing and are not part of this argument —
    # `source_guards` is why the step below can run at all.
    # They compile on Windows and would fail at run time for want of a shell,
    # which says nothing about Holdfast. Making them pass needs either a
    # Windows shell fixture or per-row gating, and that is 0.0.11's work, not a
    # thing to fake here. What runs below is the surface that is genuinely
    # platform-independent; it grows as 0.0.11 lands.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup show active-toolchain && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-native
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Native MSVC, all targets. This is the strictly stronger half of
      # `windows-cross` and the reason that job's comment no longer claims to
      # be the only Windows signal.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # **`--lib` is deliberately NOT run here, and the exclusion is measured
      # rather than assumed.** Run natively on Windows 2026-09-02, against
      # this commit, `cargo test -p holdfast-core --lib` gives:
      #
      #     721 passed; 55 failed
      #       secret::binding::tests    45
      #       secret::provider::tests    5
      #       mcp::tools::tests          5
      #
      # All 55 fail identically — `CreateProcessW "sh -c …" failed: The system
      # cannot find the file specified (os error 2)` — from fixtures that
      # spawn a real shell. Nothing else in the unit suite fails: the pty,
      # session, detect and diag tests all pass on Windows, which a reading of
      # the source would not have predicted and did not.
      #
      # So the prize for gating those three modules' shell fixtures is 721
      # real unit tests running on Windows, and it is worth taking — in
      # 0.0.11, where the Windows fixtures live. It is not taken here because
      # this job's job is to stop #19's arms being untested, and a `--skip`
      # list to dodge the 55 would either be per-test and enormous, or
      # per-module and silently drop the many passing tests in
      # `mcp::tools::tests` along with its five.
      #
      # `source_guards` is the one integration target that reads source files
      # and spawns nothing, so it runs, and the `test result:` assertion is
      # its anti-vacuity guard: a filter matching nothing reports `0 passed`
      # and exits 0, which is a green tick over no executed code.
      #
      # No floor on the count. It moves whenever anything is added, and a
      # literal here is a number nobody re-derives — the failure
      # `mcp-smoke.sh` records drifting five times with nothing going red.
      #
      # `shell: bash` throughout: the parsing is bash and the default shell on
      # a Windows runner is PowerShell. Git Bash ships on the image.
      - name: Source guards and the cross-platform lib rows, which must have run
        shell: bash
        run: |
          # **`-e` stated rather than inherited.** GitHub runs `shell: bash` as
          # `bash --noprofile --norc -eo pipefail {0}`, which this file already
          # relies on twice (see the `test` job's tee note). Relying on it is
          # correct and was correct here — but the step BELOW deliberately sets
          # `+e`, because its cases exit 64 on purpose, so one job now holds two
          # steps that need opposite error modes. Naming both locally is what
          # stops the next reader porting the wrong one across.
          #
          # Measured with a stub `cargo` that prints `test result: FAILED` and
          # exits 101: without `-e` this step exits 0 on a red suite, and the
          # three guards below do not catch it, because the row floor reads the
          # LAST `test result:` line and a `source_guards` failure has no floor.
          set -eo pipefail
          cargo test -p holdfast-core --locked --test source_guards -- --test-threads=4 2>&1 | tee win-test.log
          # **A filter, and a narrow one, for a reason the comment above
          # rejects a filter for.** Skipping the 55 shell-spawning rows would
          # need a per-module `--skip` list that drops passing tests with
          # them. NAMING the modules that exist to be cross-platform is the
          # opposite move.
          #
          # **Three modules, not two, and the earlier claim was too strong.**
          # It read that `home_dir`'s `USERPROFILE` split and
          # `open_log_append`'s create-parent / append-not-truncate contract
          # "are the only lib code in this file whose Windows arm differs from
          # its Unix one" — `create_owner_only` and `ensure_owner_only`'s
          # `#[cfg(windows)]` block are two more in the same file, and
          # `config::untrusted_reason` is a third outside it. `config::tests`
          # is added here because it was executed by NOTHING: the review
          # measured it passing on Windows, so the whole Windows trust arm was
          # compiler-verified only, for the cost of one filter.
          #
          # The pre-PR review measured four mutations of those Windows arms
          # surviving every gate, the sharpest being `.append(true)` ->
          # `.truncate(true)`, which zeroes the §9.4 audit trail on every
          # start. Re-measured after these rows landed: that mutation now
          # fails HERE and passes on Linux, which is the correct split.
          # **One invocation per module, each with its own floor.** A single
          # combined run hides which filter stopped matching: the total still
          # looks plausible, and the `0 passed` guard only fires if ALL of them
          # stop matching at once. Per-module, a renamed module is named.
          #
          # Floors are measured, dated, and deliberately below the true count
          # rather than equal to it — an equality here is a line every added
          # test row breaks, which is how `mcp-smoke.sh`'s own total drifted
          # five times with nothing going red. Measured on this commit,
          # 2026-09-03: home_tests 7, log_append_tests 2, config::tests 50 on
          # Unix and 49 on Windows (one row is `#[cfg(unix)]`). Neither
          # `paths.rs` test module has a platform gate, so those two counts are
          # the same on both platforms.
          lib_module() {
            local filter="$1" floor="$2" before after got
            before=$(grep -cE '^test result:' win-test.log || true)
            cargo test -p holdfast-core --locked --lib -- --test-threads=4 "$filter" 2>&1 | tee -a win-test.log
            after=$(grep -cE '^test result:' win-test.log)
            if [ "$after" -ne $((before + 1)) ]; then
              echo "FAIL  $filter produced no 'test result:' line — the target never started" >&2
              exit 1
            fi
            got=$(grep -E '^test result:' win-test.log | tail -1 | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+')
            if [ "${got:-0}" -lt "$floor" ]; then
              echo "FAIL  $filter matched ${got:-0} rows, want >= $floor" >&2
              echo "      a renamed module reports 0; a half-matched one reports fewer" >&2
              exit 1
            fi
            echo "ok    $filter -> ${got} rows (floor $floor)"
          }
          lib_module daemon::paths::home_tests:: 6
          lib_module daemon::paths::log_append_tests:: 2
          lib_module config::tests:: 45

          # Every invocation in this step, including source_guards above, must
          # have reported a verdict and none may have run nothing.
          results=$(grep -cE '^test result:' win-test.log)
          if [ "$results" -ne 4 ]; then
            echo "expected 4 'test result:' lines (source_guards + 3 lib modules), got $results" >&2
            grep -nE '^test result:' win-test.log >&2
            exit 1
          fi
          if grep -qE '^test result: ok\. 0 passed' win-test.log; then
            echo "an invocation reported 0 passed — it ran no code:" >&2
            grep -nE '^test result:' win-test.log >&2
            exit 1
          fi
          grep -E '^test result:' win-test.log
      # **The step this whole job exists for: the `#[cfg(windows)]` arms #19
      # added, executed on Windows.** A refusal that compiles and then exits 0,
      # or exits 64 with an empty message, is exactly the defect a
      # cross-compile cannot see.
      #
      # **What this step closes, stated as coverage rather than intent.** It
      # ran the seven CLI refusals and `daemon stop`. It does NOT assert the
      # inherited-ACL warning — that is *reached* by `log_append_tests` on
      # Windows but nothing pins its content or that it goes to stderr — and
      # the config trust arm is covered by the `config::tests::` filter added
      # above, not here. An earlier version of this comment listed all three as
      # what the step ends; it ended one of them.
      #
      # Still verified by the compiler alone: `create_owner_only` and
      # `ensure_owner_only`'s Windows blocks, whose only production callers sit
      # inside `#[cfg(unix)] daemon::{spawn,server}` and are therefore
      # unreachable in a Windows build at all.
      #
      # `version` first as the control: it shares the binary and the argument
      # parser with the arms below, so if it fails they prove nothing about
      # the arms and everything about the build.
      #
      # Both halves are asserted per subcommand — the exit code AND the
      # reason. §18.8 gives 64 to "you asked for something this build does not
      # have"; a bare 64 with no explanation sends an operator hunting.
      - name: The Windows refusal arms, exercised rather than compiled
        shell: bash
        run: |
          # **`set +e` first, and it is load bearing.** GitHub runs
          # `shell: bash` as `bash --noprofile --norc -eo pipefail {0}`, so
          # errexit is already ON before this script's first line, and
          # `set -uo pipefail` does not clear it — only `set +e` does.
          #
          # Every case below deliberately runs a command that exits 64, and
          # `run_case`'s `out="$(…)"` is an assignment whose status is the
          # substitution's. Under errexit that ends the shell on the first
          # case, before `rc` is ever read: measured, the step died 0.15s
          # after the `version` control printed, with not one `ok` or `FAIL`
          # line emitted, and reported exit 64 — the exact code it exists to
          # assert on, which is why it read as a product bug rather than a
          # harness one. The `version` line above survived only because a
          # `||` suppresses errexit for its left side.
          set +e
          set -uo pipefail
          cargo build --locked -p holdfast
          BIN=target/debug/holdfast.exe
          test -x "$BIN" || { echo "no binary at $BIN after cargo build" >&2; exit 1; }

          "$BIN" version || { echo "control failed: 'holdfast version' is broken on Windows" >&2; exit 1; }

          fails=0
          run_case() {
            out="$("$BIN" "$@" 2>&1)"; rc=$?
            if [ "$rc" -ne 64 ]; then
              echo "FAIL  holdfast $* exited $rc, want 64 (EXIT_USAGE)" >&2
              echo "      output: $out" >&2
              fails=$((fails + 1))
            elif ! printf '%s' "$out" | grep -q 'not supported on Windows native'; then
              echo "FAIL  holdfast $* exited 64 but did not say why" >&2
              echo "      output: $out" >&2
              fails=$((fails + 1))
            else
              echo "ok    holdfast $* -> 64, refused by name"
            fi
          }
          run_case daemon run
          run_case daemon start
          run_case daemon status
          run_case list
          run_case logs some-session
          # **`attach` and `watch` were the two arms this job was written to
          # cover and did not.** Both are `#[cfg(windows)]` refusals with the
          # same contract, and both carried hand-rolled copies of the message
          # rather than going through the shared helper — so rewording either
          # left all nine jobs green. They now share the one helper, and these
          # two lines are what keeps that true.
          #
          # **The session argument is required.** A bare `attach` is a usage
          # error, which `main.rs` answers with the banner — also exit 64, but
          # WITHOUT the refusal text, so the exit-code half would pass and the
          # message half would fail on a false alarm.
          run_case attach some-session
          run_case watch some-session

          # **`daemon stop` is deliberately NOT in that loop.** §3.2 makes it
          # idempotent — stopping a daemon that is not running prints "no
          # daemon running" and exits 0, pinned on Unix by
          # `stopping_a_daemon_that_is_not_running_succeeds`. On Windows there
          # is never a daemon, so that is the only case and the answer is the
          # same. Asserting 64 here would pin the contradiction rather than
          # catch it.
          out="$("$BIN" daemon stop 2>&1)"; rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "FAIL  holdfast daemon stop exited $rc, want 0 (§3.2 idempotent)" >&2
            echo "      output: $out" >&2
            fails=$((fails + 1))
          elif ! printf '%s' "$out" | grep -q 'no daemon running'; then
            echo "FAIL  holdfast daemon stop exited 0 without the §3.2 message" >&2
            echo "      output: $out" >&2
            fails=$((fails + 1))
          else
            echo "ok    holdfast daemon stop -> 0, idempotent as §3.2 requires"
          fi

          if [ "$fails" -ne 0 ]; then
            echo "$fails Windows arm(s) did not behave as #19 claims" >&2
            exit 1
          fi
          echo "seven refusal arms exit 64 and name the reason; daemon stop exits 0"

      # **The subcommand that WORKS on Windows, actually serving.** Everything
      # above proves the refusals refuse. Nothing proved the one thing Windows
      # can do still does it — the review replaced `mcp_hybrid`'s
      # `serve_in_process().await` with `ExitCode::FAILURE`, so `holdfast mcp`
      # warned and then served nothing, and the mutation survived all nine
      # jobs. If this arm breaks, Windows has no product and every other check
      # here stays green.
      #
      # It also covers `home_dir()` on the platform that needs it. `HOME` is
      # unset, so resolution must fall through to `%USERPROFILE%` — the split
      # `c14ba36` added and the one the unit tests reach only by re-exec.
      # Asserting the §9.4 audit trail lands under the directory we handed it
      # is what makes that end-to-end rather than a unit claim.
      - name: mcp --no-daemon serves, and writes the audit trail it promises
        shell: bash
        run: |
          set -eo pipefail
          BIN=target/debug/holdfast.exe
          test -x "$BIN" || { echo "no binary at $BIN" >&2; exit 1; }
          scratch="$(mktemp -d)"

          # One `initialize`, the same request `scripts/mcp-smoke.sh` opens
          # with. stdin closes after it, which is a clean shutdown for a stdio
          # server rather than an error.
          req='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          rc=0
          out="$(printf '%s\n' "$req" | env -u HOME USERPROFILE="$scratch" "$BIN" mcp --no-daemon 2>mcp-stderr.log)" || rc=$?

          if [ "$rc" -ne 0 ]; then
            echo "FAIL  mcp --no-daemon exited $rc" >&2
            sed -n '1,40p' mcp-stderr.log >&2
            exit 1
          fi
          # A served response, not just a clean exit: `ExitCode::FAILURE` in
          # place of the serve call would exit non-zero, but a stub that
          # returned SUCCESS without serving would print nothing.
          if ! printf '%s' "$out" | grep -q '"jsonrpc"'; then
            echo "FAIL  mcp --no-daemon produced no JSON-RPC response — it did not serve" >&2
            echo "      stdout: $out" >&2
            sed -n '1,40p' mcp-stderr.log >&2
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q '"result"'; then
            echo "FAIL  initialize did not answer with a result" >&2
            echo "      stdout: $out" >&2
            exit 1
          fi
          echo "ok    mcp --no-daemon answered initialize"

          # The trail, found rather than assumed: `RuntimePaths` puts it at
          # `<home>/.holdfast/logs/audit.log`, and searching for it by name
          # keeps this step honest if that layout is ever revised.
          #
          # **Existence is the assertion. Emptiness is NOT a failure, and this
          # project has already paid once for thinking otherwise.** A bare
          # `initialize` has nothing to audit: `serve_stdio` resolves the path
          # and opens the log, and entries arrive when something auditable
          # happens. `mcp/mod.rs` records the precedent directly — a 0-byte
          # `audit.log` "was once read as a missing audit trail and filed as a
          # security finding (GH #63)". Asserting non-empty here would
          # re-litigate that, and the first run of this step did exactly that
          # before this comment existed.
          #
          # What the file's PRESENCE proves is the part that was untested: that
          # `home_dir()` fell through to `%USERPROFILE%` with `HOME` unset, and
          # that `open_log_append` created the parent directories under the
          # path we handed it. If resolution had gone anywhere else — the real
          # profile, a temp dir, or nowhere — nothing would appear under
          # `$scratch` and this fails.
          #
          # Proving a WRITE needs an auditable action, and the actions that
          # audit need a PTY, which is unported on Windows until 0.0.11. That
          # is the residual, stated rather than papered over.
          log="$(find "$scratch" -name audit.log -type f 2>/dev/null | head -1)"
          if [ -z "$log" ]; then
            echo "FAIL  no audit.log anywhere under the USERPROFILE we passed" >&2
            echo "      %USERPROFILE% resolution did not reach the fallback (GH #19, c14ba36)" >&2
            find "$scratch" >&2 || true
            exit 1
          fi
          echo "ok    audit trail opened at ${log#"$scratch"/} ($(wc -c <"$log" | tr -d ' ') bytes; 0 is correct for a bare initialize)"

  # --- the capability gate -------------------------------------------------

  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Shells the test suite spawns BY NAME.
      #
      # MEASURED on image ubuntu24 20260720.247.2, run 31737949604, before
      # anything was installed: zsh NOT PREINSTALLED, fish NOT PREINSTALLED;
      # bash, sh, dash, python3 (3.12.3), jq (1.7), tmux and — contrary to
      # the image manifest, which does not list it — less (590) all present.
      # `less` stays in this line anyway: it gates the only PTY-level test of
      # REQ-PD-011/015, and a program the manifest does not promise is a
      # program that can leave without notice. `jq` is asserted by the probe
      # rather than installed. `fish` is NOT installed, by measurement — see
      # the `test` job below.
      - name: Install the shells and helpers the test suite spawns by name
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zsh dash less python3
      # The one requirement of tests/detection.rs that is a VERSION claim
      # rather than a presence one (`Need::PyreplPython`):
      # matrix_row_the_python_repl_is_at_prompt_with_no_repl_specific_config
      # needs a REPL that drives bracketed paste with no configuration.
      # PyREPL landed in CPython 3.13 and enables it itself; the image's own
      # python3 is 3.12.3, whose readline REPL emits none — measured on
      # three runner VMs — and the row then reaches §8.3's echo rung and
      # answers `AwaitingSecret` at 0.95 for an ordinary `>>> ` prompt.
      #
      # "3.13" and not a patch: the requirement is `>= 3.13`, the runner
      # image's tool cache already carries a 3.13.x so this resolves to a
      # cache hit rather than a download, and pinning the patch would turn
      # every tool-cache refresh into one.
      #
      # This step matters only because it PREPENDS its interpreter to PATH:
      # the row scans PATH for `python3` and `python3.<minor>` and asks each
      # one its own version, so an interpreter installed somewhere the scan
      # does not reach would buy nothing. ci-probe.sh prints every
      # interpreter it found and FAILS when none is >= 3.13, which is how
      # that stays true rather than assumed.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup show active-toolchain && rustc --version
      - run: ./scripts/ci-probe.sh

  # --- the suite -----------------------------------------------------------

  test:
    needs: probe
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # HOLDFAST_REQUIRE_ALL_SHELLS: "1" is STILL not set, and as of 2026-08-13
    # that is a measurement rather than a staging decision. The variable
    # makes tests/detection.rs's `have()` guard PANIC instead of skip and
    # tightens its row census to zero skips, so it can only be set once
    # every gated row can actually run. Two rows skipped when this pipeline
    # first went green. One is fixed here; the other is not CI's to fix.
    #
    #   * The PyREPL row skipped because ubuntu-24.04 ships CPython 3.12.3.
    #     `actions/setup-python` below puts a 3.13 on PATH, the row runs,
    #     and ci-probe.sh turns the build red if it ever stops being there.
    #
    #   * The fish row skipped because fish is not installed — and
    #     INSTALLING IT DOES NOT MAKE IT PASS. Measured 2026-08-13 in
    #     containers on this exact base image, at both fish versions
    #     obtainable on it:
    #
    #     fish 3.7.0, noble's own archive. The snippet installs and marks
    #     correctly — `functions -c fish_prompt __holdfast_orig_fish_prompt`,
    #     the open question the row was written for, WORKS on a built-in
    #     default prompt — and the row still fails, on its last command.
    #     `(exit 42)` is a subshell in bash and zsh and a command
    #     SUBSTITUTION in fish, which rejects it outright ("command
    #     substitutions not allowed here"), so nothing runs and the stream
    #     ends `… A B A B` where the shared expectation wants
    #     `… C D;42 A B`. The bash-ism is in the assertion helper all three
    #     shells share, in crates/, and belongs to whoever owns detection.
    #
    #     fish 4.8.1, the fish maintainers' PPA — the only route to a
    #     fish >= 4 on this image. Zero markers in 20 s: Holdfast's own
    #     snippet guard declines to inject. It probes `status test-feature
    #     no-mark-prompt`, but the feature is NAMED `mark-prompt`
    #     (`no-mark-prompt` is the spelling that disables it), so the probe
    #     answers 2 = unrecognised on every fish and the guard collapses to
    #     "decline on any fish >= 4". Also measured there: fish >= 4.1
    #     queries the terminal at startup and waits 10 s for a Primary
    #     Device Attribute reply that a bare PTY never sends.
    #
    # THE SHORTFALL IS TWO ROWS IN TWO BINARIES. This comment said "exactly
    # one row of the 21 in tests/detection.rs" until 2026-08-19 and that was
    # measurably false: REQ-TS-008's row in
    # crates/holdfast-core/tests/screen.rs skips on a fish-less host too,
    # for its own reason, and NEITHER measurement above touches it. It never
    # runs `(exit 42)` — that bash-ism is in detection.rs's shared assertion
    # helper — and it sets `shell_integration: None` and injects no snippet,
    # so the marker collision cannot reach it either. The census could not
    # see the second row because all three skip lines began with the same
    # words and one match satisfied the one agreed prefix.
    #
    # Both are ASSERTED rather than tolerated: scripts/ci-skip-census.sh now
    # carries one record per ROW, keyed on the libtest row name, and fails
    # on any skip other than those two, on either of them ceasing to happen,
    # and on either ROW going missing from the log.
    #
    # Setting the variable today would paint this job red for a defect that
    # is not the pipeline's; installing fish would do the same; dropping
    # fish from the picture would restore the silent green that this whole
    # change exists to end. The variable would ALSO not reach REQ-TS-008 if
    # it were set — it is read only by tests/detection.rs's `have()`, and
    # tests/screen.rs is a separate binary — which is review finding I7(a)
    # and a change to that test file rather than to this one.
    #
    # WHAT THAT ROW NEEDED WAS ITS OWN FISH, and it now has one: the
    # `fish-req-ts-008` job below installs fish 4.8.1 and measures it.
    #
    # WHEN DETECTION.RS'S FISH ROW CAN PASS, five things move in ONE change:
    # `fish` into the apt line here and in the probe job, the variable set
    # here and in nightly.yml, and BOTH records deleted from
    # ci-skip-census.sh.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the shells and helpers the test suite spawns by name
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zsh dash less python3
      # `Need::PyreplPython` — see the probe job for why this is a version
      # claim and not a presence one. The row asks each `python3` and
      # `python3.<minor>` on PATH for its own version, so what makes this
      # step count is that it prepends its interpreter to PATH.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup show active-toolchain && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The census's own gates, deleted one at a time against fixtures with
      # known answers. It reads no log, needs no build and takes under a
      # second, and it runs BEFORE the suite so a census that can no longer
      # fail is found in seconds rather than after the forty-minute job it
      # is supposed to be guarding.
      - name: Prove the skip census can still fail
        run: ./scripts/ci-skip-census.sh --self-test
      # WHY NEXTEST RUNS THE SUITE AND `cargo test` NO LONGER DOES.
      #
      # `cargo test` has no per-test timeout. A test that wedges — a pty
      # read that never returns, a wait_for_pattern on a prompt that never
      # comes — holds the whole run until this job's `timeout-minutes: 40`
      # fires. That was already a RED build; `timeout-minutes` has been on
      # every job here from the start. What it was not was an ATTRIBUTED
      # one: the runner kills the process group from outside, cargo has
      # printed nothing about the test still in flight, and the log ends
      # mid-suite naming nobody. nextest gives that failure a name — SLOW,
      # then TERMINATING, then TIMEOUT, each naming the test, with whatever
      # the test printed before it hung preserved, escalating SIGTERM to
      # SIGKILL after a grace period and exiting 100.
      #
      # The kill threshold lives in `.config/nextest.toml`, not here, so a
      # developer's local run behaves the same way. See that file for why
      # 60s/300s and not some other pair.
      #
      # Installed as its own static binary rather than `cargo install`
      # (minutes of compile on every run) and deliberately NOT added to
      # Cargo.toml: it is a tool this pipeline runs, not something the crate
      # depends on. Same treatment as actionlint above, with one difference
      # that is stated rather than papered over — actionlint publishes a
      # `checksums.txt` and nextest publishes none, so there is nothing to
      # verify AGAINST and the most that can be done is to record what was
      # fetched. The digest below is the 0.9.143 linux tarball, taken twice
      # from two fetches; GitHub release assets are immutable, so a mismatch
      # here means the artefact changed underneath the version and the job
      # should stop rather than run it.
      - name: Install cargo-nextest, at the digest recorded for the pinned version
        env:
          NEXTEST_VERSION: 0.9.143
          NEXTEST_SHA256: 66786b9abe23920d022a182d1416b1bbc8130dd4872a9553d76985a1708dcd1e
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://get.nexte.st/${NEXTEST_VERSION}/linux" \
            -o cargo-nextest.tar.gz
          echo "${NEXTEST_SHA256}  cargo-nextest.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/.cargo/bin"
          tar xzf cargo-nextest.tar.gz -C "${HOME}/.cargo/bin" cargo-nextest
          cargo nextest --version
      # --no-fail-fast is not optional. Measured on this project: without it
      # a lib-test failure hides whether the integration suite catches the
      # same defect, which is the only way to tell a narrow defect from a
      # broad one.
      #
      # --success-output immediate prints the captured stdout/stderr of
      # *passing* tests, so a `skipping: …` notice — and a `not-asserted: …`
      # one, from an assertion gated off inside a row that RAN — is visible
      # in the log instead of swallowed. It replaces `cargo test`'s
      # `--show-output`, which nextest does not have. It is also what the
      # census step below reads, which is why the log is teed rather than
      # only printed.
      #
      # --no-output-indent IS MANDATORY and does not look it. Nextest's
      # default indents captured output by four spaces; every `^`-anchored
      # grep in ci-skip-census.sh then matches nothing, and the census
      # reports a clean "nothing skipped" on a run that skipped two rows.
      # The script's self-test carries a fixture for exactly that.
      #
      # `2>&1` used to matter for one line — cargo's `Running
      # tests/detection.rs …` banner, printed on STDERR, which the census's
      # vacuity gate reads. Under nextest it is the WHOLE log: measured,
      # nextest writes its entire stream to stderr (status lines, captured
      # test output, summary) and leaves stdout empty, so without it the
      # `tee` produces a zero-byte file.
      #
      # `set -o pipefail` is not decoration: the default shell for `run:`
      # is `bash -e {0}` WITHOUT pipefail, so a failing test run piped
      # into `tee` would exit 0 and this job would go green on a red suite.
      # It is what makes nextest's exit 100 on a TIMEOUT reach this job.
      - name: Run the suite, keeping the log for the skip census
        run: |
          set -o pipefail
          cargo nextest run --workspace --locked --no-fail-fast -j "${{ env.TEST_THREADS }}" --success-output immediate --no-output-indent 2>&1 | tee test-output.log
      # NEXTEST DOES NOT RUN DOCTESTS AT ALL — a documented, deliberate gap
      # in it, not a flag anyone can pass. Both doctests in this workspace
      # are `ignored` today, so this step measures nothing and costs
      # seconds; it is here so that the CAPABILITY does not vanish silently.
      # Without it, the first non-ignored doctest anyone writes would be
      # collected by rustdoc, reported by nobody, and asserted by nothing.
      - name: Doctests, which nextest does not run
        run: cargo test --workspace --locked --doc
      # The census the variable would have enforced from inside the suite.
      # It fails on any skip this pipeline has not agreed to, and on an
      # agreed one that stopped happening — and, since it grew a second
      # marker, on any ASSERTION gated off inside a row that ran without an
      # agreed entry, and on an agreed entry whose assertion turns out to
      # have run. The one entry today is §11.4's control-path p99, which the
      # hosted runner cannot make a statement about; it goes red here the day
      # the runner is big enough, which is the only notice anyone will get.
      #
      # (This said "this 2-core runner". The runner became 4-core when the
      # repository went public on 2026-09-02, and the entry did NOT go red —
      # correctly, because `ci-skip-census.sh` gates on `min_cores=8` and 4 is
      # still under it. The sentence named the wrong number as the trigger.)
      #
      # `if: always()` is the whole reason nextest was adopted paying off.
      # A TIMEOUT exits 100, the step above goes red, and the default
      # `if: success()` would SKIP the census on precisely the run someone
      # needs to read — the hang. The log is teed before the pipeline's exit
      # status is known, so it exists and is worth censusing either way; and
      # a census finding cannot mask a suite failure, because a failed step
      # earlier in the job already decides the job.
      - if: always()
        run: ./scripts/ci-skip-census.sh test-output.log

  # --- the one row the fish-less suite cannot measure ----------------------

  fish-req-ts-008:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # §4.5.1's decision to write unsolicited bytes into a child's stdin rests
    # on this row's three-arm measurement, and until now that measurement had
    # executed NOWHERE in this repository's automation — the only evidence
    # was two container trials recorded in a prose comment. The `test` job
    # cannot host it: installing fish there takes detection.rs's fish row
    # red, for a defect that is not the pipeline's. So the row gets its own
    # job and its own fish, and the `detection` binary is never invoked here,
    # which leaves that expected failure exactly where it was.
    #
    # THE PPA IS NOT A CONVENIENCE. Measured 2026-08-19 by running this row's
    # own test binary in containers, at all three fish versions obtainable:
    #
    #   fish 4.8.1 (this PPA)  — the row RUNS and PASSES. Silent arm 10.02 s,
    #     all-but-DA1 10.07 s with all four probes answered, DA1 0.054 s,
    #     against assertions of >= 5 s / >= 5 s / < 1 s. This is the fish the
    #     row was calibrated on.
    #   fish 4.2.1 (Ubuntu 26.04's archive) — the row RUNS and FAILS, twice
    #     over: 4.2.1 emits no OSC 11 background query at all, so the middle
    #     arm answers three probes of four and its `assert_eq!` fails, and
    #     its silent arm reaches a prompt in 2.01 s rather than the >= 5 s
    #     the row asserts. 4.2.1 does not do 4.1's ten-second DA1 wait.
    #   fish 3.7.0 (noble's own archive) — the row's second arm SKIPS it.
    #
    # So "install any fish >= 4" is not the requirement and would be a red
    # job; noble's own fish is not the requirement and would be a silent
    # skip. `ppa:fish-shell/release-4` is the only route to a fish this row
    # can measure on ubuntu-24.04, and it was verified on that exact base
    # image: `apt-cache policy fish` reports 4.8.1-1~noble after the add.
    #
    # Not gated on `probe`: the probe asserts the presence of the shells the
    # main suite spawns by name, and fish is deliberately not among them —
    # this job installs its own. Gating would add the probe's minutes to a
    # job that needs none of its assertions.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install fish 4.x from the fish-shell maintainers' PPA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:fish-shell/release-4
          sudo apt-get install -y -qq --no-install-recommends fish
          fish --version
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup show active-toolchain && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fish-req-ts-008
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `--show-output` is load-bearing twice over, not decoration copied
      # from the `test` job. The row announces what it measured with
      # `eprintln!`, and libtest captures that for a PASSING test; without
      # the flag the log below contains neither the `skipping: ` notice nor
      # the `REQ-TS-008 measured against ` line, and the "did it skip?" check
      # would be reading a file that cannot contain the answer either way.
      #
      # `set -o pipefail`: the default shell for `run:` is `bash -e {0}`
      # WITHOUT it, so a failing `cargo test` piped into `tee` exits 0.
      - name: Measure REQ-TS-008 against a real fish
        run: |
          set -o pipefail
          cargo test -p holdfast-core --locked --test screen -- \
            --exact only_answering_da1_takes_fish_to_its_first_prompt \
            --show-output 2>&1 | tee fish-req-ts-008.log
      # A step that installs fish and a row that still skips is the same
      # defect one layer up, and it is the one this job exists to end: a
      # SKIPPED row reports `ok` and `1 passed; 0 failed`, so the step above
      # is green either way. Three checks, each catching what the others
      # cannot:
      #
      #   1. exactly one row ran — catches the row RENAMED or DELETED, where
      #      the filter matches nothing and libtest reports `0 passed` with
      #      everything filtered out, cheerfully, at exit 0.
      #   2. no `skipping: ` notice — catches the fish install silently
      #      resolving to noble's 3.7.0, which the row's second arm skips.
      #   3. the row's own `REQ-TS-008 measured against ` line IS present —
      #      the anti-vacuity check that makes 2 mean something. Without it,
      #      a log whose `--show-output` was dropped contains no `skipping: `
      #      line for the reason that it contains no captured output at all,
      #      and check 2 passes on a run that proves nothing.
      - name: The row must have RUN — a skipped row is a pass that is not one
        run: |
          if ! grep -qE '^test result: ok\. 1 passed; 0 failed;' fish-req-ts-008.log; then
            echo "REQ-TS-008 did not report exactly one passing row. The row was" >&2
            echo "renamed, deleted, or filtered out — this job measured nothing." >&2
            grep -E '^test result:' fish-req-ts-008.log >&2 || true
            exit 1
          fi
          if grep -q '^skipping: ' fish-req-ts-008.log; then
            echo "REQ-TS-008 SKIPPED on a runner that installed fish for it:" >&2
            grep '^skipping: ' fish-req-ts-008.log >&2
            fish --version >&2 || true
            exit 1
          fi
          if ! grep -q '^REQ-TS-008 measured against ' fish-req-ts-008.log; then
            echo "The row reported no 'REQ-TS-008 measured against …' line, so this" >&2
            echo "log cannot show whether it skipped. Was --show-output dropped?" >&2
            exit 1
          fi
          grep -E '^REQ-TS-008 ' fish-req-ts-008.log

  # --- the artifact --------------------------------------------------------

  package:
    # `needs: test` is the whole point: no artifact exists for a tree that
    # did not pass. The build that gets installed is the build that was
    # tested.
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup show active-toolchain && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked --workspace
      # The same smoke script, against the binary that will actually be
      # installed. `jq` is preinstalled on ubuntu-24.04 (1.7.1).
      - run: ./scripts/mcp-smoke.sh ./target/release/holdfast
      # And the negative control, which is what makes the run above mean
      # something. CONTRIBUTING.md has claimed since 0.0.1 that every
      # counted check fails against a binary that does nothing, and
      # nothing ever ran it: 0.0.6 shipped four checks that stayed green
      # against `/bin/true` and all four gates were still green, because
      # "a check you can run" is not a check.
      #
      # Inverted on purpose -- here a PASSING smoke run is the failure --
      # and `F == N` rather than a literal, so adding a check cannot make
      # this step stale. Needs no build: `/bin/true` is the binary.
      - name: mcp-smoke negative control (every counted check must fail)
        run: |
          if ./scripts/mcp-smoke.sh /bin/true > negative-control.txt 2>&1; then
            echo "the negative control PASSED: some counted check does not depend on the server" >&2
            cat negative-control.txt >&2
            exit 1
          fi
          line="$(grep '^SMOKE FAILED:' negative-control.txt || true)"
          f="$(printf '%s\n' "$line" | sed -n 's/^SMOKE FAILED: \([0-9]*\) of [0-9]* .*/\1/p')"
          n="$(printf '%s\n' "$line" | sed -n 's/^SMOKE FAILED: [0-9]* of \([0-9]*\) .*/\1/p')"
          if [ -z "$f" ] || [ "$f" != "$n" ]; then
            echo "expected every counted check to fail against /bin/true, got: ${line:-<no SMOKE FAILED line>}" >&2
            grep '^  ok ' negative-control.txt >&2 || true
            exit 1
          fi
          echo "negative control: $f of $n checks failed, as required"
          rm -f negative-control.txt
      - run: sha256sum target/release/holdfast | tee holdfast-linux-x86_64.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: holdfast-linux-x86_64-${{ github.sha }}
          path: |
            target/release/holdfast
            holdfast-linux-x86_64.sha256
          retention-days: 30
          # The default is `warn`, which produces a GREEN job with a warning
          # nobody reads when the binary is missing. That is a job that
          # cannot fail. `error` is mandatory here.
          if-no-files-found: error
